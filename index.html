<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>خريطة الملاحة 3D — مجسمات بيوت</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800&display=swap" rel="stylesheet" />
  <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <style>
    * { box-sizing: border-box; }
    html, body, #map {
      margin: 0; padding: 0; width: 100%; height: 100%;
      background: #090d16; font-family: 'Cairo', sans-serif;
      overflow: hidden;
    }

    .top-panel {
      position: fixed; top: 10px; right: 10px; left: 10px; z-index: 30;
      background: rgba(10, 15, 28, 0.94); color: #f8fafc;
      padding: 10px 12px; border-radius: 16px;
      border: 1px solid rgba(251, 191, 36, 0.45);
      backdrop-filter: blur(8px);
      display: flex; flex-direction: column; gap: 8px;
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.5);
      max-width: 440px;
    }
    .top-panel.day-ui {
      background: rgba(255, 255, 255, 0.96);
      color: #0f172a;
      border-color: rgba(15, 23, 42, 0.18);
    }

    .row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }

    button, select {
      background: #1e293b; color: #f8fafc;
      border: 1px solid rgba(255,255,255,0.16);
      border-radius: 9px; padding: 6px 10px;
      font-size: 12px; font-weight: 700; cursor: pointer;
      font-family: 'Cairo', sans-serif;
      white-space: nowrap;
    }
    button:active { transform: scale(0.96); }
    button.active {
      background: #f59e0b; color: #090d16;
      font-weight: 800; border-color: #f59e0b;
    }
    button.gps-active {
      background: #0284c7; color: #ffffff;
      border-color: #38bdf8;
    }

    .day-ui button, .day-ui select {
      background: #e2e8f0; color: #0f172a;
      border-color: rgba(15, 23, 42, 0.14);
    }
    .day-ui button.active {
      background: #d97706; color: #ffffff; border-color: #d97706;
    }

    .gps-trip-bar {
      position: fixed; bottom: 56px; right: 10px; left: 10px; z-index: 30;
      background: rgba(10, 15, 28, 0.94); color: #f8fafc;
      border: 1px solid rgba(56, 189, 248, 0.4);
      border-radius: 14px; padding: 8px 10px;
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
      backdrop-filter: blur(8px);
      box-shadow: 0 8px 22px rgba(0, 0, 0, 0.45);
      font-size: 12px; font-weight: 700;
    }
    .gps-trip-bar.day-ui {
      background: rgba(255, 255, 255, 0.96);
      color: #0f172a;
      border-color: rgba(15, 23, 42, 0.2);
    }

    .gov-bar {
      position: fixed; bottom: 8px; right: 10px; left: 10px; z-index: 30;
      background: rgba(10, 15, 28, 0.94);
      border: 1px solid rgba(251, 191, 36, 0.35);
      border-radius: 12px; padding: 6px 8px;
      display: flex; gap: 6px; overflow-x: auto;
      backdrop-filter: blur(8px);
    }
    .gov-bar.day-ui {
      background: rgba(255, 255, 255, 0.96);
      border-color: rgba(15, 23, 42, 0.2);
    }
    .gov-btn { flex-shrink: 0; }

    .user-puck {
      width: 22px; height: 22px; border-radius: 50%;
      background: #0ea5e9; border: 3px solid #ffffff;
      box-shadow: 0 0 16px rgba(14, 165, 233, 0.95);
    }
  </style>
</head>
<body>

  <div class="top-panel" id="topPanel">
    <div id="modeBadge" style="font-size:13px;font-weight:800;">الوضع الليلي التلقائي مفعّل 🌙</div>
    <div class="row">
      <button id="btnAuto" class="active" onclick="setMode('auto')">تلقائي</button>
      <button id="btnDay" onclick="setMode('day')">نهاري ☀️</button>
      <button id="btnNight" onclick="setMode('night')">ليلي 🌙</button>
      <button id="btnSat" onclick="toggleSatellite()">قمر صناعي 🛰️</button>
    </div>
    <div class="row">
      <button id="btnGPS" onclick="toggleGPS()">موقعي GPS 📍</button>
      <button id="btn3D" class="active" onclick="toggle3D()">مجسمات 3D</button>
      <button onclick="map.zoomIn()">+</button>
      <button onclick="map.zoomOut()">−</button>
      <button onclick="resetNorth()">الشمال</button>
    </div>
  </div>

  <div class="gps-trip-bar" id="gpsBar">
    <div>
      <div id="tripStatus">موقعك مفعّل • اضغط على الخريطة لرسم مسار</div>
      <div id="speedStatus" style="color:#38bdf8;">السرعة: 0 كم/س</div>
    </div>
    <div class="row">
      <select id="quickDest" onchange="goQuickDest()">
        <option value="">وجهة سريعة...</option>
        <option value="45.2845,31.3265">كورنيش السماوة</option>
        <option value="45.2944,31.3320">مركز السماوة</option>
        <option value="44.4054,33.3267">ساحة التحرير - بغداد</option>
        <option value="44.3820,33.2850">الجادرية - بغداد</option>
      </select>
      <button onclick="clearRoute()">مسح</button>
    </div>
  </div>

  <div class="gov-bar" id="govBar"></div>
  <div id="map"></div>

  <script>
    maplibregl.setRTLTextPlugin(
      'https://unpkg.com/@mapbox/mapbox-gl-rtl-text@0.2.3/mapbox-gl-rtl-text.min.js',
      true
    );

    const govs = [
      { id: "muthanna", name: "السماوة (المثنى)", lng: 45.2944, lat: 31.3320, zoom: 16.3 },
      { id: "baghdad", name: "بغداد", lng: 44.3820, lat: 33.2850, zoom: 16.2 },
      { id: "najaf", name: "النجف", lng: 44.3462, lat: 31.9960, zoom: 16.2 },
      { id: "basra", name: "البصرة", lng: 47.7804, lat: 30.5085, zoom: 16.0 },
      { id: "karbala", name: "كربلاء", lng: 44.0249, lat: 32.6160, zoom: 16.1 },
      { id: "erbil", name: "أربيل", lng: 44.0092, lat: 36.1911, zoom: 16.0 },
      { id: "mosul", name: "الموصل", lng: 43.1189, lat: 36.3400, zoom: 16.0 },
      { id: "babylon", name: "بابل", lng: 44.4267, lat: 32.4637, zoom: 16.1 },
      { id: "dhiqar", name: "ذي قار", lng: 46.2573, lat: 31.0437, zoom: 16.1 },
      { id: "wasit", name: "واسط", lng: 45.8173, lat: 32.5128, zoom: 16.1 },
      { id: "maysan", name: "ميسان", lng: 47.1450, lat: 31.8356, zoom: 16.1 },
      { id: "diwaniya", name: "الديوانية", lng: 44.9255, lat: 31.9922, zoom: 16.1 },
      { id: "anbar", name: "الأنبار", lng: 43.3078, lat: 33.4262, zoom: 16.0 },
      { id: "diyala", name: "ديالى", lng: 44.6380, lat: 33.7540, zoom: 16.1 },
      { id: "salahaddin", name: "صلاح الدين", lng: 43.6786, lat: 34.6120, zoom: 16.0 },
      { id: "kirkuk", name: "كركوك", lng: 44.3666, lat: 35.4681, zoom: 16.0 },
      { id: "duhok", name: "دهوك", lng: 42.9504, lat: 36.8675, zoom: 16.0 },
      { id: "sulaymaniyah", name: "السليمانية", lng: 45.4329, lat: 35.5570, zoom: 16.0 }
    ];

    let currentMode = 'auto';
    let is3D = true;
    let isSatellite = false; // مطفأ افتراضياً لتجنب صور القمر الصناعي الضبابية
    let watchId = null;
    let currentPos = [45.2944, 31.3320];
    let userMarker = null;
    let destMarker = null;

    const govBar = document.getElementById('govBar');
    govs.forEach((g, i) => {
      const b = document.createElement('button');
      b.className = 'gov-btn' + (i === 0 ? ' active' : '');
      b.id = 'gbtn-' + g.id;
      b.innerText = g.name;
      b.onclick = () => focusGov(g.id);
      govBar.appendChild(b);
    });

    // توليد مجسمات بيوت سكنية حول مركز المنطقة الحالية لتغطية الأحياء غير المرسومة في OSM
    function createHouseBlocksAround(centerLng, centerLat) {
      const features = [];
      let seed = Math.abs(Math.floor((centerLng * 10000) + (centerLat * 10000))) || 777;
      const rnd = () => {
        seed = (seed * 16807) % 2147483647;
        return (seed - 1) / 2147483646;
      };

      const stepLng = 0.00034;
      const stepLat = 0.00030;

      for (let r = -8; r <= 8; r++) {
        for (let c = -8; c <= 8; c++) {
          // ترك ممرات وأزقة بين الكتل
          if (Math.abs(r) % 3 === 0 || Math.abs(c) % 3 === 0) continue;
          if (rnd() < 0.18) continue;

          const cx = centerLng + c * stepLng;
          const cy = centerLat + r * stepLat;
          const w = stepLng * (0.62 + rnd() * 0.18);
          const h = stepLat * (0.62 + rnd() * 0.18);
          const height = Math.floor(6.5 + rnd() * 4.5); // ارتفاع بيت سكني متناسق

          features.push({
            type: "Feature",
            properties: { height },
            geometry: {
              type: "Polygon",
              coordinates: [[
                [cx - w / 2, cy - h / 2],
                [cx + w / 2, cy - h / 2],
                [cx + w / 2, cy + h / 2],
                [cx - w / 2, cy + h / 2],
                [cx - w / 2, cy - h / 2]
              ]]
            }
          });
        }
      }

      return { type: "FeatureCollection", features };
    }

    function isNight() {
      if (currentMode === 'night') return true;
      if (currentMode === 'day') return false;
      const h = new Date().getHours();
      return h >= 18 || h < 6;
    }

    const map = new maplibregl.Map({
      container: "map",
      style: "https://tiles.openfreemap.org/styles/liberty",
      center: currentPos,
      zoom: 16.3,
      pitch: 60,
      bearing: -12,
      antialias: true
    });

    map.on('load', () => {
      map.addSource('esri-sat', {
        type: 'raster',
        tiles: ['https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'],
        tileSize: 256,
        attribution: '© Esri'
      });

      const layers = map.getStyle().layers;
      let firstSymbolId;
      for (const l of layers) {
        if (l.type === 'symbol' && l.layout && l.layout['text-field']) {
          firstSymbolId = l.id;
          break;
        }
      }

      map.addLayer({
        id: 'sat-layer',
        type: 'raster',
        source: 'esri-sat',
        layout: { visibility: 'none' },
        paint: { 'raster-opacity': 0.95 }
      }, firstSymbolId);

      if (map.getLayer('building')) map.setLayoutProperty('building', 'visibility', 'none');
      if (map.getLayer('building-3d')) map.removeLayer('building-3d');

      // مجسمات بيوت المنطقة الحالية
      map.addSource('area-houses', {
        type: 'geojson',
        data: createHouseBlocksAround(currentPos[0], currentPos[1])
      });

      map.addLayer({
        id: 'area-houses-3d',
        source: 'area-houses',
        type: 'fill-extrusion',
        minzoom: 14.2,
        paint: {
          'fill-extrusion-color': '#334155',
          'fill-extrusion-height': ['get', 'height'],
          'fill-extrusion-base': 0,
          'fill-extrusion-opacity': 0.92
        }
      }, firstSymbolId);

      // مباني OSM الحقيقية
      map.addLayer({
        id: 'osm-buildings-3d',
        source: 'openmaptiles',
        'source-layer': 'building',
        type: 'fill-extrusion',
        minzoom: 14.0,
        paint: {
          'fill-extrusion-color': '#475569',
          'fill-extrusion-height': [
            'interpolate', ['linear'], ['zoom'],
            14.0, 0,
            14.8, ['min', 45, ['*', ['coalesce', ['get', 'render_height'], 10], 1.15]]
          ],
          'fill-extrusion-base': ['coalesce', ['get', 'render_min_height'], 0],
          'fill-extrusion-opacity': 0.95
        }
      }, firstSymbolId);

      // مسار الرحلة الحقيقي (OSRM)
      map.addSource('route-src', {
        type: 'geojson',
        data: { type: 'FeatureCollection', features: [] }
      });

      map.addLayer({
        id: 'route-line',
        type: 'line',
        source: 'route-src',
        layout: { 'line-join': 'round', 'line-cap': 'round' },
        paint: { 'line-color': '#38bdf8', 'line-width': 6, 'line-opacity': 0.95 }
      }, firstSymbolId);

      updateTheme();
    });

    async function drawRouteTo(destLng, destLat, label = "الوجهة") {
      document.getElementById('tripStatus').innerText = 'جاري حساب المسار...';
      try {
        const url = `https://router.project-osrm.org/route/v1/driving/${currentPos[0]},${currentPos[1]};${destLng},${destLat}?overview=full&geometries=geojson`;
        const res = await fetch(url);
        const data = await res.json();
        if (!data.routes || !data.routes.length) {
          document.getElementById('tripStatus').innerText = 'تعذر إيجاد مسار';
          return;
        }
        const r = data.routes[0];
        map.getSource('route-src').setData({ type: 'Feature', geometry: r.geometry });
        if (destMarker) destMarker.remove();
        destMarker = new maplibregl.Marker({ color: '#ef4444' }).setLngLat([destLng, destLat]).addTo(map);
        const km = (r.distance / 1000).toFixed(1);
        const mins = Math.max(1, Math.round(r.duration / 60));
        document.getElementById('tripStatus').innerText = `${label}: ${km} كم • ${mins} دقيقة`;
      } catch (e) {
        document.getElementById('tripStatus').innerText = 'خطأ في جلب المسار';
      }
    }

    function goQuickDest() {
      const v = document.getElementById('quickDest').value;
      if (!v) return;
      const [lng, lat] = v.split(',').map(Number);
      drawRouteTo(lng, lat, 'وجهة سريعة');
    }

    function clearRoute() {
      document.getElementById('quickDest').value = '';
      if (map.getSource('route-src')) {
        map.getSource('route-src').setData({ type: 'FeatureCollection', features: [] });
      }
      if (destMarker) { destMarker.remove(); destMarker = null; }
      document.getElementById('tripStatus').innerText = 'اضغط على الخريطة لرسم مسار';
    }

    map.on('click', (e) => {
      if (e.originalEvent.target.closest('button, select, .top-panel, .gps-trip-bar, .gov-bar')) return;
      drawRouteTo(e.lngLat.lng, e.lngLat.lat, 'نقطة مختارة');
    });

    function toggleGPS() {
      const btn = document.getElementById('btnGPS');
      if (watchId !== null) {
        navigator.geolocation.clearWatch(watchId);
        watchId = null;
        btn.classList.remove('gps-active');
        document.getElementById('speedStatus').innerText = 'GPS متوقف';
        return;
      }
      if (!navigator.geolocation) {
        alert('المتصفح لا يدعم GPS');
        return;
      }
      btn.classList.add('gps-active');
      watchId = navigator.geolocation.watchPosition(
        (pos) => {
          const { latitude, longitude, speed } = pos.coords;
          currentPos = [longitude, latitude];

          if (map.getSource('area-houses')) {
            map.getSource('area-houses').setData(createHouseBlocksAround(longitude, latitude));
          }

          if (!userMarker) {
            const el = document.createElement('div');
            el.className = 'user-puck';
            userMarker = new maplibregl.Marker({ element: el }).setLngLat(currentPos).addTo(map);
          } else {
            userMarker.setLngLat(currentPos);
          }

          map.flyTo({ center: currentPos, zoom: 16.4, pitch: is3D ? 60 : 0, duration: 700 });
          const kmh = (typeof speed === 'number' && !isNaN(speed) && speed >= 0) ? Math.round(speed * 3.6) : 0;
          document.getElementById('speedStatus').innerText = `السرعة: ${kmh} كم/س`;
          document.getElementById('tripStatus').innerText = 'موقعك مفعّل • اضغط على الخريطة لرسم مسار';
        },
        () => {
          watchId = null;
          btn.classList.remove('gps-active');
          document.getElementById('tripStatus').innerText = 'تأكد من تفعيل صلاحية الموقع في المتصفح';
        },
        { enableHighAccuracy: true, maximumAge: 1000 }
      );
    }

    function updateTheme() {
      const night = isNight();
      document.getElementById('modeBadge').innerText = night
        ? (currentMode === 'auto' ? 'الوضع الليلي التلقائي مفعّل 🌙' : 'الوضع الليلي مفعّل 🌙')
        : (currentMode === 'auto' ? 'الوضع النهاري التلقائي مفعّل ☀️' : 'الوضع النهاري مفعّل ☀️');

      ['topPanel', 'gpsBar', 'govBar'].forEach(id => {
        document.getElementById(id).classList.toggle('day-ui', !night);
      });

      map.setLight({
        anchor: 'viewport',
        color: night ? '#e2e8f0' : '#ffffff',
        intensity: night ? 0.55 : 0.82,
        position: [1.5, 180, 48]
      });

      if (map.getLayer('sat-layer')) {
        map.setLayoutProperty('sat-layer', 'visibility', isSatellite ? 'visible' : 'none');
      }

      (map.getStyle()?.layers || []).forEach(l => {
        if (['sat-layer', 'area-houses-3d', 'osm-buildings-3d', 'route-line'].includes(l.id)) return;
        if (l.type === 'background') {
          map.setPaintProperty(l.id, 'background-color', night ? '#090f1d' : '#e2e8f0');
        }
        if (l.type === 'line' && l.id.includes('road')) {
          map.setPaintProperty(l.id, 'line-color', night ? '#26364d' : '#94a3b8');
        }
      });

      if (map.getLayer('area-houses-3d')) {
        map.setPaintProperty('area-houses-3d', 'fill-extrusion-color', night ? '#334155' : '#cbd5e1');
      }

      if (map.getLayer('osm-buildings-3d')) {
        map.setPaintProperty('osm-buildings-3d', 'fill-extrusion-color', night
          ? [
              'interpolate', ['linear'], ['coalesce', ['get', 'render_height'], 10],
              0, '#1e293b',
              15, '#334155',
              30, '#475569'
            ]
          : [
              'interpolate', ['linear'], ['coalesce', ['get', 'render_height'], 10],
              0, '#e2e8f0',
              15, '#cbd5e1',
              30, '#94a3b8'
            ]
        );
      }
    }

    function toggleSatellite() {
      isSatellite = !isSatellite;
      document.getElementById('btnSat').classList.toggle('active', isSatellite);
      updateTheme();
    }

    function setMode(m) {
      currentMode = m;
      ['btnAuto', 'btnDay', 'btnNight'].forEach(id => document.getElementById(id).classList.remove('active'));
      if (m === 'auto') document.getElementById('btnAuto').classList.add('active');
      if (m === 'day') document.getElementById('btnDay').classList.add('active');
      if (m === 'night') document.getElementById('btnNight').classList.add('active');
      updateTheme();
    }

    function toggle3D() {
      is3D = !is3D;
      document.getElementById('btn3D').classList.toggle('active', is3D);
      map.easeTo({ pitch: is3D ? 60 : 0, duration: 500 });
      ['area-houses-3d', 'osm-buildings-3d'].forEach(id => {
        if (map.getLayer(id)) map.setLayoutProperty(id, 'visibility', is3D ? 'visible' : 'none');
      });
    }

    function focusGov(id) {
      const g = govs.find(x => x.id === id);
      if (!g) return;
      if (watchId === null) currentPos = [g.lng, g.lat];
      if (map.getSource('area-houses')) {
        map.getSource('area-houses').setData(createHouseBlocksAround(g.lng, g.lat));
      }
      document.querySelectorAll('.gov-btn').forEach(b => b.classList.remove('active'));
      const el = document.getElementById('gbtn-' + id);
      if (el) el.classList.add('active');
      map.flyTo({ center: [g.lng, g.lat], zoom: g.zoom, pitch: is3D ? 60 : 0, duration: 800 });
    }

    function resetNorth() {
      map.easeTo({ bearing: 0, duration: 500 });
    }
  </script>
</body>
</html>
