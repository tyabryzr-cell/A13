<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>خريطة وملاحة العراق — MapMax Style</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800&display=swap" rel="stylesheet" />
  <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <style>
    * { box-sizing: border-box; }
    html, body, #map {
      margin: 0; padding: 0; width: 100%; height: 100%;
      background: #090d16; font-family: 'Cairo', sans-serif;
      overflow: hidden;
    }

    /* لوحة التحكم العلوية */
    .top-panel {
      position: fixed; top: 10px; right: 10px; left: 10px; z-index: 30;
      background: rgba(10, 15, 28, 0.94); color: #f8fafc;
      padding: 10px 12px; border-radius: 16px;
      border: 1px solid rgba(251, 191, 36, 0.45);
      backdrop-filter: blur(8px);
      display: flex; flex-direction: column; gap: 8px;
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.5);
      max-width: 460px;
    }
    .top-panel.day-ui {
      background: rgba(255, 255, 255, 0.96);
      color: #0f172a;
      border-color: rgba(15, 23, 42, 0.18);
    }

    .row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }

    button, input {
      background: #1e293b; color: #f8fafc;
      border: 1px solid rgba(255,255,255,0.16);
      border-radius: 9px; padding: 6px 10px;
      font-size: 12px; font-weight: 700;
      font-family: 'Cairo', sans-serif;
    }
    button { cursor: pointer; white-space: nowrap; }
    button:active { transform: scale(0.96); }
    button.active {
      background: #f59e0b; color: #090d16;
      font-weight: 800; border-color: #f59e0b;
    }
    button.gps-active {
      background: #0284c7; color: #ffffff;
      border-color: #38bdf8;
    }

    .day-ui button, .day-ui input {
      background: #e2e8f0; color: #0f172a;
      border-color: rgba(15, 23, 42, 0.14);
    }
    .day-ui button.active {
      background: #d97706; color: #ffffff; border-color: #d97706;
    }

    /* بطاقة الأماكن والملاحة بأسلوب MapMax */
    .max-card {
      position: fixed; bottom: 56px; right: 10px; left: 10px; z-index: 30;
      background: rgba(10, 15, 28, 0.95); color: #f8fafc;
      border: 1px solid rgba(56, 189, 248, 0.45);
      border-radius: 16px; padding: 10px 12px;
      display: flex; flex-direction: column; gap: 8px;
      backdrop-filter: blur(10px);
      box-shadow: 0 10px 26px rgba(0, 0, 0, 0.55);
      max-width: 480px;
    }
    .max-card.day-ui {
      background: rgba(255, 255, 255, 0.97);
      color: #0f172a;
      border-color: rgba(15, 23, 42, 0.2);
    }

    .search-box { display: flex; gap: 6px; }
    .search-box input { flex: 1; outline: none; }

    .places-chips {
      display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px;
    }
    .place-chip {
      flex-shrink: 0;
      background: rgba(30, 41, 59, 0.9);
      border: 1px solid rgba(148, 163, 184, 0.25);
      border-radius: 10px; padding: 5px 10px;
      font-size: 11px; font-weight: 700; cursor: pointer;
    }
    .place-chip.selected {
      background: #0284c7; color: #ffffff; border-color: #38bdf8;
    }
    .day-ui .place-chip {
      background: #f1f5f9; color: #0f172a;
    }
    .day-ui .place-chip.selected {
      background: #0284c7; color: #ffffff;
    }

    .route-summary {
      display: flex; justify-content: space-between; align-items: center;
      font-size: 12px; font-weight: 800; color: #38bdf8;
    }
    .day-ui .route-summary { color: #0369a1; }

    /* شريط المحافظات */
    .gov-bar {
      position: fixed; bottom: 8px; right: 10px; left: 10px; z-index: 30;
      background: rgba(10, 15, 28, 0.94);
      border: 1px solid rgba(251, 191, 36, 0.35);
      border-radius: 12px; padding: 6px 8px;
      display: flex; gap: 6px; overflow-x: auto;
      backdrop-filter: blur(8px);
    }
    .gov-bar.day-ui {
      background: rgba(255, 255, 255, 0.96);
      border-color: rgba(15, 23, 42, 0.2);
    }
    .gov-btn { flex-shrink: 0; }

    .user-puck {
      width: 22px; height: 22px; border-radius: 50%;
      background: #0ea5e9; border: 3px solid #ffffff;
      box-shadow: 0 0 16px rgba(14, 165, 233, 0.95);
    }
  </style>
</head>
<body>

  <div class="top-panel" id="topPanel">
    <div id="modeBadge" style="font-size:13px;font-weight:800;">الوضع الليلي التلقائي مفعّل 🌙</div>
    <div class="row">
      <button id="btnAuto" class="active" onclick="setMode('auto')">تلقائي</button>
      <button id="btnDay" onclick="setMode('day')">نهاري ☀️</button>
      <button id="btnNight" onclick="setMode('night')">ليلي 🌙</button>
      <button id="btnSat" onclick="toggleSatellite()">قمر صناعي 🛰️</button>
    </div>
    <div class="row">
      <button id="btnGPS" onclick="toggleGPS()">موقعي GPS 📍</button>
      <button id="btn3D" class="active" onclick="toggle3D()">مجسمات 3D</button>
      <button onclick="map.zoomIn()">+</button>
      <button onclick="map.zoomOut()">−</button>
      <button onclick="resetNorth()">الشمال</button>
    </div>
  </div>

  <!-- بطاقة الأماكن والملاحة (أسلوب MapMax) -->
  <div class="max-card" id="maxCard">
    <div class="search-box">
      <input id="searchInput" type="text" placeholder="ابحث عن مكان أو شارع في العراق..." oninput="filterQuickPlaces()" onkeydown="if(event.key==='Enter') searchByName()" />
      <button class="active" onclick="searchByName()">ملاحة</button>
      <button onclick="clearRoute()">مسح</button>
    </div>

    <div class="places-chips" id="placesList"></div>

    <div class="route-summary">
      <span id="routeText">اختر موقعاً من القائمة أو اضغط على الخريطة</span>
      <span id="speedText">السرعة: 0 كم/س</span>
    </div>
  </div>

  <div class="gov-bar" id="govBar"></div>
  <div id="map"></div>

  <script>
    maplibregl.setRTLTextPlugin(
      'https://unpkg.com/@mapbox/mapbox-gl-rtl-text@0.2.3/mapbox-gl-rtl-text.min.js',
      true
    );

    const govs = [
      { id: "muthanna", name: "السماوة (المثنى)", lng: 45.2944, lat: 31.3320, zoom: 16.2 },
      { id: "baghdad", name: "بغداد", lng: 44.3820, lat: 33.2850, zoom: 16.0 },
      { id: "najaf", name: "النجف", lng: 44.3462, lat: 31.9960, zoom: 16.0 },
      { id: "basra", name: "البصرة", lng: 47.7804, lat: 30.5085, zoom: 15.8 },
      { id: "karbala", name: "كربلاء", lng: 44.0249, lat: 32.6160, zoom: 15.9 },
      { id: "erbil", name: "أربيل", lng: 44.0092, lat: 36.1911, zoom: 15.8 },
      { id: "mosul", name: "الموصل", lng: 43.1189, lat: 36.3400, zoom: 15.8 },
      { id: "babylon", name: "بابل", lng: 44.4267, lat: 32.4637, zoom: 15.9 },
      { id: "dhiqar", name: "ذي قار", lng: 46.2573, lat: 31.0437, zoom: 15.9 },
      { id: "wasit", name: "واسط", lng: 45.8173, lat: 32.5128, zoom: 15.9 },
      { id: "maysan", name: "ميسان", lng: 47.1450, lat: 31.8356, zoom: 15.9 },
      { id: "diwaniya", name: "الديوانية", lng: 44.9255, lat: 31.9922, zoom: 15.9 },
      { id: "anbar", name: "الأنبار", lng: 43.3078, lat: 33.4262, zoom: 15.8 },
      { id: "diyala", name: "ديالى", lng: 44.6380, lat: 33.7540, zoom: 15.9 },
      { id: "salahaddin", name: "صلاح الدين", lng: 43.6786, lat: 34.6120, zoom: 15.8 },
      { id: "kirkuk", name: "كركوك", lng: 44.3666, lat: 35.4681, zoom: 15.8 },
      { id: "duhok", name: "دهوك", lng: 42.9504, lat: 36.8675, zoom: 15.8 },
      { id: "sulaymaniyah", name: "السليمانية", lng: 45.4329, lat: 35.5570, zoom: 15.8 }
    ];

    const quickPlaces = [
      { id: "p1", name: "كورنيش السماوة", lng: 45.2845, lat: 31.3265 },
      { id: "p2", name: "مركز السماوة", lng: 45.2944, lat: 31.3320 },
      { id: "p3", name: "ساحة التحرير - بغداد", lng: 44.4054, lat: 33.3267 },
      { id: "p4", name: "الجادرية - بغداد", lng: 44.3820, lat: 33.2850 },
      { id: "p5", name: "مركز النجف", lng: 44.3462, lat: 31.9960 },
      { id: "p6", name: "مركز البصرة", lng: 47.7804, lat: 30.5085 }
    ];

    let currentMode = 'auto';
    let is3D = true;
    let isSatellite = false;
    let watchId = null;
    let currentPos = [45.2944, 31.3320];
    let selectedPlaceId = null;
    let userMarker = null;
    let destMarker = null;

    const govBar = document.getElementById('govBar');
    govs.forEach((g, i) => {
      const b = document.createElement('button');
      b.className = 'gov-btn' + (i === 0 ? ' active' : '');
      b.id = 'gbtn-' + g.id;
      b.innerText = g.name;
      b.onclick = () => focusGov(g.id);
      govBar.appendChild(b);
    });

    function renderQuickPlaces(list = quickPlaces) {
      const container = document.getElementById('placesList');
      container.innerHTML = '';
      list.forEach(p => {
        const chip = document.createElement('div');
        chip.className = 'place-chip' + (p.id === selectedPlaceId ? ' selected' : '');
        chip.innerText = p.name;
        chip.onclick = () => {
          selectedPlaceId = p.id;
          renderQuickPlaces(list);
          startNavigationTo(p.lng, p.lat, p.name);
        };
        container.appendChild(chip);
      });
    }

    function filterQuickPlaces() {
      const q = document.getElementById('searchInput').value.trim().toLowerCase();
      if (!q) {
        renderQuickPlaces(quickPlaces);
        return;
      }
      renderQuickPlaces(quickPlaces.filter(p => p.name.toLowerCase().includes(q)));
    }

    function isNight() {
      if (currentMode === 'night') return true;
      if (currentMode === 'day') return false;
      const h = new Date().getHours();
      return h >= 18 || h < 6;
    }

    const map = new maplibregl.Map({
      container: "map",
      style: "https://tiles.openfreemap.org/styles/liberty",
      center: currentPos,
      zoom: 16.2,
      pitch: 60,
      bearing: -12,
      antialias: true
    });

    map.on('load', () => {
      map.addSource('esri-sat', {
        type: 'raster',
        tiles: ['https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'],
        tileSize: 256,
        attribution: '© Esri'
      });

      const layers = map.getStyle().layers;
      let firstSymbolId;
      for (const l of layers) {
        if (l.type === 'symbol' && l.layout && l.layout['text-field']) {
          firstSymbolId = l.id;
          break;
        }
      }

      map.addLayer({
        id: 'sat-layer',
        type: 'raster',
        source: 'esri-sat',
        layout: { visibility: 'none' },
        paint: { 'raster-opacity': 0.95 }
      }, firstSymbolId);

      if (map.getLayer('building')) map.setLayoutProperty('building', 'visibility', 'none');
      if (map.getLayer('building-3d')) map.removeLayer('building-3d');

      map.addLayer({
        id: 'osm-3d',
        source: 'openmaptiles',
        'source-layer': 'building',
        type: 'fill-extrusion',
        minzoom: 14.0,
        paint: {
          'fill-extrusion-color': '#475569',
          'fill-extrusion-height': [
            'interpolate', ['linear'], ['zoom'],
            14.0, 0,
            14.8, ['min', 45, ['*', ['coalesce', ['get', 'render_height'], 10], 1.15]]
          ],
          'fill-extrusion-base': ['coalesce', ['get', 'render_min_height'], 0],
          'fill-extrusion-opacity': 0.92
        }
      }, firstSymbolId);

      map.addSource('nav-route', {
        type: 'geojson',
        data: { type: 'FeatureCollection', features: [] }
      });

      map.addLayer({
        id: 'nav-route-line',
        type: 'line',
        source: 'nav-route',
        layout: { 'line-join': 'round', 'line-cap': 'round' },
        paint: { 'line-color': '#38bdf8', 'line-width': 6.5, 'line-opacity': 0.95 }
      }, firstSymbolId);

      renderQuickPlaces();
      updateTheme();
    });

    async function startNavigationTo(destLng, destLat, title = "الوجهة") {
      document.getElementById('routeText').innerText = `جاري حساب المسار إلى ${title}...`;
      try {
        const url = `https://router.project-osrm.org/route/v1/driving/${currentPos[0]},${currentPos[1]};${destLng},${destLat}?overview=full&geometries=geojson`;
        const res = await fetch(url);
        const data = await res.json();
        if (!data.routes || !data.routes.length) {
          document.getElementById('routeText').innerText = 'تعذر إيجاد مسار';
          return;
        }
        const r = data.routes[0];
        map.getSource('nav-route').setData({ type: 'Feature', geometry: r.geometry });
        if (destMarker) destMarker.remove();
        destMarker = new maplibregl.Marker({ color: '#ef4444' }).setLngLat([destLng, destLat]).addTo(map);
        const km = (r.distance / 1000).toFixed(1);
        const mins = Math.max(1, Math.round(r.duration / 60));
        document.getElementById('routeText').innerText = `${title}: ${km} كم • ${mins} دقيقة`;
        map.flyTo({ center: [destLng, destLat], zoom: 15.4, pitch: is3D ? 60 : 0, duration: 850 });
      } catch (e) {
        document.getElementById('routeText').innerText = 'خطأ أثناء حساب المسار';
      }
    }

    async function searchByName() {
      const q = document.getElementById('searchInput').value.trim();
      if (!q) return;
      document.getElementById('routeText').innerText = `جاري البحث عن "${q}"...`;
      try {
        const url = `https://nominatim.openstreetmap.org/search?format=json&countrycodes=iq&limit=1&q=${encodeURIComponent(q)}`;
        const res = await fetch(url);
        const list = await res.json();
        if (!list || !list.length) {
          document.getElementById('routeText').innerText = 'لم يتم العثور على المكان';
          return;
        }
        startNavigationTo(parseFloat(list[0].lon), parseFloat(list[0].lat), q);
      } catch (e) {
        document.getElementById('routeText').innerText = 'خطأ في البحث';
      }
    }

    function clearRoute() {
      selectedPlaceId = null;
      document.getElementById('searchInput').value = '';
      renderQuickPlaces();
      if (map.getSource('nav-route')) {
        map.getSource('nav-route').setData({ type: 'FeatureCollection', features: [] });
      }
      if (destMarker) { destMarker.remove(); destMarker = null; }
      document.getElementById('routeText').innerText = 'اختر موقعاً من القائمة أو اضغط على الخريطة';
    }

    map.on('click', (e) => {
      if (e.originalEvent.target.closest('button, input, .top-panel, .max-card, .gov-bar')) return;
      startNavigationTo(e.lngLat.lng, e.lngLat.lat, 'نقطة مختارة');
    });

    function toggleGPS() {
      const btn = document.getElementById('btnGPS');
      if (watchId !== null) {
        navigator.geolocation.clearWatch(watchId);
        watchId = null;
        btn.classList.remove('gps-active');
        document.getElementById('speedText').innerText = 'GPS متوقف';
        return;
      }
      if (!navigator.geolocation) {
        alert('المتصفح لا يدعم GPS');
        return;
      }
      btn.classList.add('gps-active');
      watchId = navigator.geolocation.watchPosition(
        (pos) => {
          const { latitude, longitude, speed } = pos.coords;
          currentPos = [longitude, latitude];
          if (!userMarker) {
            const el = document.createElement('div');
            el.className = 'user-puck';
            userMarker = new maplibregl.Marker({ element: el }).setLngLat(currentPos).addTo(map);
          } else {
            userMarker.setLngLat(currentPos);
          }
          map.flyTo({ center: currentPos, zoom: 16.3, pitch: is3D ? 60 : 0, duration: 700 });
          const kmh = (typeof speed === 'number' && !isNaN(speed) && speed >= 0) ? Math.round(speed * 3.6) : 0;
          document.getElementById('speedText').innerText = `السرعة: ${kmh} كم/س`;
        },
        () => {
          watchId = null;
          btn.classList.remove('gps-active');
          document.getElementById('routeText').innerText = 'يرجى تفعيل صلاحية الموقع في المتصفح';
        },
        { enableHighAccuracy: true, maximumAge: 1000 }
      );
    }

    function updateTheme() {
      const night = isNight();
      document.getElementById('modeBadge').innerText = night
        ? (currentMode === 'auto' ? 'الوضع الليلي التلقائي مفعّل 🌙' : 'الوضع الليلي مفعّل 🌙')
        : (currentMode === 'auto' ? 'الوضع النهاري التلقائي مفعّل ☀️' : 'الوضع النهاري مفعّل ☀️');

      ['topPanel', 'maxCard', 'govBar'].forEach(id => {
        document.getElementById(id).classList.toggle('day-ui', !night);
      });

      map.setLight({
        anchor: 'viewport',
        color: night ? '#e2e8f0' : '#ffffff',
        intensity: night ? 0.55 : 0.82,
        position: [1.5, 180, 48]
      });

      if (map.getLayer('sat-layer')) {
        map.setLayoutProperty('sat-layer', 'visibility', isSatellite ? 'visible' : 'none');
      }

      (map.getStyle()?.layers || []).forEach(l => {
        if (['sat-layer', 'osm-3d', 'nav-route-line'].includes(l.id)) return;
        if (l.type === 'background') {
          map.setPaintProperty(l.id, 'background-color', night ? '#090f1d' : '#e2e8f0');
        }
        if (l.type === 'line' && l.id.includes('road')) {
          map.setPaintProperty(l.id, 'line-color', night ? '#26364d' : '#94a3b8');
        }
      });

      if (map.getLayer('osm-3d')) {
        map.setPaintProperty('osm-3d', 'fill-extrusion-color', night
          ? [
              'interpolate', ['linear'], ['coalesce', ['get', 'render_height'], 10],
              0, '#1e293b',
              15, '#334155',
              30, '#475569'
            ]
          : [
              'interpolate', ['linear'], ['coalesce', ['get', 'render_height'], 10],
              0, '#e2e8f0',
              15, '#cbd5e1',
              30, '#94a3b8'
            ]
        );
      }
    }

    function toggleSatellite() {
      isSatellite = !isSatellite;
      document.getElementById('btnSat').classList.toggle('active', isSatellite);
      updateTheme();
    }

    function setMode(m) {
      currentMode = m;
      ['btnAuto', 'btnDay', 'btnNight'].forEach(id => document.getElementById(id).classList.remove('active'));
      if (m === 'auto') document.getElementById('btnAuto').classList.add('active');
      if (m === 'day') document.getElementById('btnDay').classList.add('active');
      if (m === 'night') document.getElementById('btnNight').classList.add('active');
      updateTheme();
    }

    function toggle3D() {
      is3D = !is3D;
      document.getElementById('btn3D').classList.toggle('active', is3D);
      map.easeTo({ pitch: is3D ? 60 : 0, duration: 500 });
      if (map.getLayer('osm-3d')) {
        map.setLayoutProperty('osm-3d', 'visibility', is3D ? 'visible' : 'none');
      }
    }

    function focusGov(id) {
      const g = govs.find(x => x.id === id);
      if (!g) return;
      if (watchId === null) currentPos = [g.lng, g.lat];
      document.querySelectorAll('.gov-btn').forEach(b => b.classList.remove('active'));
      const el = document.getElementById('gbtn-' + id);
      if (el) el.classList.add('active');
      map.flyTo({ center: [g.lng, g.lat], zoom: g.zoom, pitch: is3D ? 60 : 0, duration: 800 });
    }

    function resetNorth() {
      map.easeTo({ bearing: 0, duration: 500 });
    }
  </script>
</body>
</html>
