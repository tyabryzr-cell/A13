<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>خريطة العراق 3D</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700&display=swap" rel="stylesheet" />
  <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <style>
    * { box-sizing: border-box; }
    body, html, #map {
      margin: 0; padding: 0; width: 100%; height: 100%;
      background: #0b1120; font-family: 'Cairo', sans-serif;
    }
    .panel {
      position: fixed; top: 12px; right: 12px; z-index: 20;
      background: rgba(10, 15, 28, 0.94); color: #f8fafc;
      padding: 10px 12px; border-radius: 12px; font-size: 13px;
      border: 1px solid rgba(251, 191, 36, 0.4);
      display: flex; flex-direction: column; gap: 8px; max-width: 280px;
    }
    .btn-row { display: flex; gap: 6px; flex-wrap: wrap; }
    button {
      background: #1e293b; color: #f8fafc; border: 1px solid rgba(255,255,255,0.2);
      border-radius: 8px; padding: 6px 10px; font-size: 12px; cursor: pointer;
      font-family: 'Cairo', sans-serif;
    }
    button.active { background: #f59e0b; color: #090d16; font-weight: 700; }
    .ar-label {
      background: rgba(9, 13, 22, 0.92);
      color: #fde047;
      border: 1px solid #f59e0b;
      padding: 3px 9px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
      pointer-events: none;
    }
    .ar-label.day {
      background: rgba(255, 255, 255, 0.95);
      color: #0f172a;
      border-color: #1e293b;
    }
  </style>
</head>
<body>
  <div class="panel">
    <div id="modeBadge">جاري تشغيل الخريطة...</div>
    <div class="btn-row">
      <button id="btnAuto" class="active" onclick="setMode('auto')">تلقائي</button>
      <button id="btnDay" onclick="setMode('day')">نهاري ☀️</button>
      <button id="btnNight" onclick="setMode('night')">ليلي 🌙</button>
    </div>
    <div class="btn-row">
      <button onclick="focusPlace(44.3661, 33.3152)">بغداد</button>
      <button onclick="focusPlace(45.2944, 31.3320)">السماوة</button>
      <button onclick="toggle3D()">زاوية 3D</button>
    </div>
  </div>
  <div id="map"></div>

  <script>
    let currentMode = 'auto';
    let is3D = true;
    const markers = [];

    const places = [
      { name: "بغداد - ساحة التحرير", lng: 44.4054, lat: 33.3267 },
      { name: "الكرادة", lng: 44.4265, lat: 33.3075 },
      { name: "المنصور", lng: 44.3462, lat: 33.3128 },
      { name: "الجادرية", lng: 44.3820, lat: 33.2850 },
      { name: "السماوة - مركز المدينة", lng: 45.2944, lat: 31.3320 },
      { name: "كورنيش السماوة", lng: 45.2845, lat: 31.3265 }
    ];

    const lightsGeoJSON = {
      type: "FeatureCollection",
      features: [
        { type: "Feature", geometry: { type: "Point", coordinates: [44.4054, 33.3267] } },
        { type: "Feature", geometry: { type: "Point", coordinates: [44.4265, 33.3075] } },
        { type: "Feature", geometry: { type: "Point", coordinates: [44.3462, 33.3128] } },
        { type: "Feature", geometry: { type: "Point", coordinates: [44.3820, 33.2850] } },
        { type: "Feature", geometry: { type: "Point", coordinates: [44.3661, 33.3152] } },
        { type: "Feature", geometry: { type: "Point", coordinates: [45.2944, 31.3320] } },
        { type: "Feature", geometry: { type: "Point", coordinates: [45.2845, 31.3265] } }
      ]
    };

    const buildingsGeoJSON = {
      type: "FeatureCollection",
      features: [
        {
          type: "Feature",
          properties: { height: 70 },
          geometry: {
            type: "Polygon",
            coordinates: [[
              [44.3645, 33.3142], [44.3665, 33.3142], [44.3665, 33.3158], [44.3645, 33.3158], [44.3645, 33.3142]
            ]]
          }
        },
        {
          type: "Feature",
          properties: { height: 55 },
          geometry: {
            type: "Polygon",
            coordinates: [[
              [45.2930, 31.3310], [45.2952, 31.3310], [45.2952, 31.3328], [45.2930, 31.3328], [45.2930, 31.3310]
            ]]
          }
        }
      ]
    };

    function isNight() {
      if (currentMode === 'night') return true;
      if (currentMode === 'day') return false;
      const h = new Date().getHours();
      return h >= 18 || h < 6;
    }

    const map = new maplibregl.Map({
      container: "map",
      style: {
        version: 8,
        sources: {
          osm: {
            type: "raster",
            tiles: ["https://tile.openstreetmap.org/{z}/{x}/{y}.png"],
            tileSize: 256,
            attribution: "© OpenStreetMap"
          },
          lights: {
            type: "geojson",
            data: lightsGeoJSON
          },
          buildings: {
            type: "geojson",
            data: buildingsGeoJSON
          }
        },
        layers: [
          {
            id: "base-map",
            type: "raster",
            source: "osm",
            paint: {
              "raster-brightness-max": 0.25,
              "raster-contrast": 0.35,
              "raster-saturation": -0.65
            }
          },
          {
            id: "buildings-3d",
            type: "fill-extrusion",
            source: "buildings",
            paint: {
              "fill-extrusion-color": "#f59e0b",
              "fill-extrusion-height": ["get", "height"],
              "fill-extrusion-opacity": 0.9
            }
          },
          {
            id: "lights-glow",
            type: "circle",
            source: "lights",
            paint: {
              "circle-radius": ["interpolate", ["linear"], ["zoom"], 10, 16, 16, 48],
              "circle-color": "#fbbf24",
              "circle-blur": 0.95,
              "circle-opacity": 0.65
            }
          },
          {
            id: "lights-core",
            type: "circle",
            source: "lights",
            paint: {
              "circle-radius": ["interpolate", ["linear"], ["zoom"], 10, 4, 16, 8],
              "circle-color": "#fef08a",
              "circle-opacity": 1
            }
          }
        ]
      },
      center: [44.3661, 33.3152],
      zoom: 13.5,
      pitch: 58,
      bearing: -15
    });

    map.addControl(new maplibregl.NavigationControl());

    function renderLabels(night) {
      markers.forEach(m => m.remove());
      markers.length = 0;
      places.forEach(p => {
        const el = document.createElement("div");
        el.className = night ? "ar-label" : "ar-label day";
        el.innerText = p.name;
        markers.push(new maplibregl.Marker({ element: el }).setLngLat([p.lng, p.lat]).addTo(map));
      });
    }

    function updateVisuals() {
      const night = isNight();
      document.getElementById("modeBadge").innerText = night
        ? (currentMode === "auto" ? "الوضع الليلي التلقائي مفعّل 🌙" : "الوضع الليلي مفعّل 🌙")
        : (currentMode === "auto" ? "الوضع النهاري التلقائي مفعّل ☀️" : "الوضع النهاري مفعّل ☀️");

      if (map.getLayer("base-map")) {
        map.setPaintProperty("base-map", "raster-brightness-max", night ? 0.25 : 0.95);
        map.setPaintProperty("base-map", "raster-contrast", night ? 0.35 : 0.15);
        map.setPaintProperty("base-map", "raster-saturation", night ? -0.65 : -0.2);
      }

      if (map.getLayer("buildings-3d")) {
        map.setPaintProperty("buildings-3d", "fill-extrusion-color", night ? "#f59e0b" : "#64748b");
      }

      if (map.getLayer("lights-glow")) {
        map.setPaintProperty("lights-glow", "circle-opacity", night ? 0.65 : 0.05);
      }
      if (map.getLayer("lights-core")) {
        map.setPaintProperty("lights-core", "circle-opacity", night ? 1 : 0.25);
      }

      renderLabels(night);
    }

    function setMode(mode) {
      currentMode = mode;
      document.getElementById("btnAuto").classList.toggle("active", mode === "auto");
      document.getElementById("btnDay").classList.toggle("active", mode === "day");
      document.getElementById("btnNight").classList.toggle("active", mode === "night");
      updateVisuals();
    }

    function focusPlace(lng, lat) {
      map.flyTo({ center: [lng, lat], zoom: 14.5, pitch: is3D ? 58 : 0 });
    }

    function toggle3D() {
      is3D = !is3D;
      map.easeTo({ pitch: is3D ? 58 : 0 });
    }

    updateVisuals();
    map.on("load", updateVisuals);
  </script>
</body>
</html>
