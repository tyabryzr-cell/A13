<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>خريطة العراق 3D</title>
  <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <style>
    body, html, #map { margin: 0; padding: 0; width: 100%; height: 100%; }
    .badge {
      position: fixed; top: 12px; right: 12px; z-index: 10;
      background: rgba(15, 23, 42, 0.88); color: #fff;
      padding: 8px 14px; border-radius: 10px; font-family: sans-serif; font-size: 13px;
      border: 1px solid rgba(255,255,255,0.15);
    }
  </style>
</head>
<body>
  <div class="badge" id="modeBadge">جاري تحميل الخريطة...</div>
  <div id="map"></div>

  <script>
    const hour = new Date().getHours();
    const isNight = hour >= 18 || hour < 6;
    document.getElementById("modeBadge").innerText = isNight
      ? "الوضع الليلي التلقائي مفعّل 🌙"
      : "الوضع النهاري مفعّل ☀️";

    const roadUrl = "./istockphoto-1042084638-612x612%20(1).jpg";

    const map = new maplibregl.Map({
      container: "map",
      style: {
        version: 8,
        sources: {
          osm: {
            type: "raster",
            tiles: ["https://tile.openstreetmap.org/{z}/{x}/{y}.png"],
            tileSize: 256,
            attribution: "© OpenStreetMap"
          },
          roadTex: {
            type: "image",
            url: roadUrl,
            coordinates: [
              [44.30, 33.25],
              [44.50, 33.25],
              [44.50, 33.38],
              [44.30, 33.38]
            ]
          }
        },
        layers: [
          {
            id: "osm-layer",
            type: "raster",
            source: "osm",
            paint: {
              "raster-brightness-max": isNight ? 0.30 : 1.0,
              "raster-contrast": isNight ? 0.25 : 0.05,
              "raster-saturation": isNight ? -0.45 : 0.1
            }
          },
          {
            id: "road-texture-layer",
            type: "raster",
            source: "roadTex",
            paint: {
              "raster-opacity": 0.85
            }
          }
        ]
      },
      center: [44.3661, 33.3152],
      zoom: 12,
      pitch: 55,
      bearing: -15
    });

    map.addControl(new maplibregl.NavigationControl());
  </script>
</body>
</html>
