<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>خريطة العراق 3D - الخطوة 3</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;700&display=swap" rel="stylesheet" />
  <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <style>
    body, html, #map { margin: 0; padding: 0; width: 100%; height: 100%; background: #070b14; font-family: 'Cairo', sans-serif; }
    .panel {
      position: fixed; top: 12px; right: 12px; z-index: 10;
      background: rgba(15, 23, 42, 0.94); color: #f8fafc;
      padding: 10px 12px; border-radius: 12px; font-size: 13px;
      border: 1px solid rgba(255,255,255,0.16); display: flex; flex-direction: column; gap: 8px;
      max-width: 270px;
    }
    .btn-row { display: flex; gap: 6px; flex-wrap: wrap; }
    button {
      background: #1e293b; color: #f8fafc; border: 1px solid rgba(255,255,255,0.2);
      border-radius: 8px; padding: 6px 10px; font-size: 12px; cursor: pointer; font-family: 'Cairo', sans-serif;
    }
    button.active { background: #f59e0b; color: #0f172a; font-weight: bold; }
  </style>
</head>
<body>
  <div class="panel">
    <div id="modeBadge">جاري تحميل الخريطة...</div>
    <div class="btn-row">
      <button id="btnAuto" class="active" onclick="setMode('auto')">تلقائي</button>
      <button id="btnDay" onclick="setMode('day')">نهاري ☀️</button>
      <button id="btnNight" onclick="setMode('night')">ليلي 🌙</button>
    </div>
    <div class="btn-row">
      <button onclick="focusCity(44.3661, 33.3152)">بغداد</button>
      <button onclick="focusCity(45.2944, 31.3320)">السماوة</button>
      <button onclick="togglePitch()">زاوية 3D</button>
    </div>
  </div>
  <div id="map"></div>

  <script>
    let currentMode = 'auto';
    let highPitch = true;
    const roadTextureUrl = "./istockphoto-1042084638-612x612%20(1).jpg";

    function isNightMode() {
      if (currentMode === 'night') return true;
      if (currentMode === 'day') return false;
      const h = new Date().getHours();
      return h >= 18 || h < 6;
    }

    const streetLightsGeoJSON = {
      type: "FeatureCollection",
      features: [
        { type: "Feature", geometry: { type: "Point", coordinates: [44.4054, 33.3267] } },
        { type: "Feature", geometry: { type: "Point", coordinates: [44.4265, 33.3075] } },
        { type: "Feature", geometry: { type: "Point", coordinates: [44.3462, 33.3128] } },
        { type: "Feature", geometry: { type: "Point", coordinates: [44.3820, 33.2850] } },
        { type: "Feature", geometry: { type: "Point", coordinates: [45.2944, 31.3320] } },
        { type: "Feature", geometry: { type: "Point", coordinates: [45.2800, 31.3200] } }
      ]
    };

    const map = new maplibregl.Map({
      container: "map",
      style: "https://tiles.openfreemap.org/styles/liberty",
      center: [44.3661, 33.3152],
      zoom: 15.2,
      pitch: 62,
      bearing: -20
    });

    map.addControl(new maplibregl.NavigationControl());

    function applyThemeToStyle(imageLoaded) {
      const night = isNightMode();
      const style = map.getStyle();

      document.getElementById("modeBadge").innerText = night
        ? (currentMode === "auto" ? "الوضع الليلي التلقائي مفعّل 🌙" : "الوضع الليلي مفعّل 🌙")
        : (currentMode === "auto" ? "الوضع النهاري التلقائي مفعّل ☀️" : "الوضع النهاري مفعّل ☀️");

      if (style && style.layers) {
        style.layers.forEach((layer) => {
          if (layer.id === "iraq-3d-buildings") return;

          // إظلام الخلفية والأراضي ليلاً لتباين واضح مع الإنارة والمباني
          if (layer.type === "background") {
            map.setPaintProperty(layer.id, "background-color", night ? "#090d16" : "#eef2f6");
          }

          if (layer.type === "fill") {
            map.setPaintProperty(layer.id, "fill-color", night ? "#111827" : "#e2e8f0");
            map.setPaintProperty(layer.id, "fill-opacity", night ? 0.75 : 0.65);
          }

          // تخصيص الشوارع: تبليط داكن واضح بدل الرصاصي الباهت
          if (layer.type === "line" && layer.id && (layer.id.includes("road") || layer.id.includes("highway") || layer.id.includes("street") || layer.id.includes("path"))) {
            if (imageLoaded && map.hasImage("asphalt-pattern")) {
              map.setPaintProperty(layer.id, "line-pattern", "asphalt-pattern");
              map.setPaintProperty(layer.id, "line-opacity", night ? 0.95 : 0.9);
            } else {
              map.setPaintProperty(layer.id, "line-color", night ? "#1f2937" : "#334155");
            }
          }

          // تحسين خط النصوص وتوضيح ألوانها ليلاً ونهاراً
          if (layer.type === "symbol") {
            try {
              map.setLayoutProperty(layer.id, "text-font", ["Cairo Regular", "Noto Sans Arabic Regular", "Open Sans Regular"]);
              map.setPaintProperty(layer.id, "text-color", night ? "#f8fafc" : "#0f172a");
              map.setPaintProperty(layer.id, "text-halo-color", night ? "#090d16" : "#ffffff");
              map.setPaintProperty(layer.id, "text-halo-width", 1.5);
            } catch (_) {}
          }
        });
      }

      // إضافة/تحديث طبقة المباني 3D
      if (!map.getLayer("iraq-3d-buildings")) {
        const vectorSourceId = Object.keys(map.getStyle().sources).find(
          (k) => map.getStyle().sources[k].type === "vector"
        );
        if (vectorSourceId) {
          map.addLayer({
            id: "iraq-3d-buildings",
            source: vectorSourceId,
            "source-layer": "building",
            type: "fill-extrusion",
            minzoom: 13.5,
            paint: {
              "fill-extrusion-color": night ? "#f59e0b" : "#94a3b8",
              "fill-extrusion-height": [
                "interpolate", ["linear"], ["zoom"],
                13.5, 0,
                15, ["coalesce", ["get", "render_height"], ["get", "height"], 14]
              ],
              "fill-extrusion-base": ["coalesce", ["get", "render_min_height"], ["get", "min_height"], 0],
              "fill-extrusion-opacity": night ? 0.9 : 0.85
            }
          });
        }
      } else {
        map.setPaintProperty("iraq-3d-buildings", "fill-extrusion-color", night ? "#f59e0b" : "#94a3b8");
        map.setPaintProperty("iraq-3d-buildings", "fill-extrusion-opacity", night ? 0.9 : 0.85);
      }

      // إنارة الشوارع ليلاً
      if (!map.getSource("street-lights")) {
        map.addSource("street-lights", { type: "geojson", data: streetLightsGeoJSON });
      }
      if (!map.getLayer("street-lights-glow")) {
        map.addLayer({
          id: "street-lights-glow",
          type: "circle",
          source: "street-lights",
          paint: {
            "circle-radius": ["interpolate", ["linear"], ["zoom"], 11, 14, 16, 44],
            "circle-color": "#fbbf24",
            "circle-blur": 0.9,
            "circle-opacity": night ? 0.6 : 0.05
          }
        });
      } else {
        map.setPaintProperty("street-lights-glow", "circle-opacity", night ? 0.6 : 0.05);
      }

      map.setLight({
        anchor: "viewport",
        color: night ? "#fde68a" : "#ffffff",
        intensity: night ? 0.65 : 0.35
      });
    }

    function enhanceMap() {
      if (!map.hasImage("asphalt-pattern")) {
        map.loadImage(roadTextureUrl, (err, image) => {
          if (!err && image) {
            map.addImage("asphalt-pattern", image, { pixelRatio: 2 });
            applyThemeToStyle(true);
          } else {
            applyThemeToStyle(false);
          }
        });
      } else {
        applyThemeToStyle(true);
      }
    }

    function setMode(mode) {
      currentMode = mode;
      document.getElementById("btnAuto").classList.toggle("active", mode === "auto");
      document.getElementById("btnDay").classList.toggle("active", mode === "day");
      document.getElementById("btnNight").classList.toggle("active", mode === "night");
      enhanceMap();
    }

    function focusCity(lng, lat) {
      map.flyTo({ center: [lng, lat], zoom: 15.2, pitch: highPitch ? 62 : 0 });
    }

    function togglePitch() {
      highPitch = !highPitch;
      map.easeTo({ pitch: highPitch ? 62 : 0 });
    }

    map.on("load", enhanceMap);
  </script>
</body>
</html>
