<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>خريطة العراق 3D</title>
  <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <style>
    body, html, #map { margin: 0; padding: 0; width: 100%; height: 100%; }
    .panel {
      position: fixed; top: 12px; right: 12px; z-index: 10;
      background: rgba(15, 23, 42, 0.9); color: #fff;
      padding: 10px 14px; border-radius: 12px; font-family: sans-serif; font-size: 13px;
      border: 1px solid rgba(255,255,255,0.16); display: flex; flex-direction: column; gap: 8px;
    }
    .btn-row { display: flex; gap: 6px; }
    button {
      background: #1e293b; color: #fff; border: 1px solid rgba(255,255,255,0.2);
      border-radius: 8px; padding: 5px 10px; font-size: 12px; cursor: pointer;
    }
    button.active { background: #f59e0b; color: #0f172a; font-weight: bold; }
  </style>
</head>
<body>
  <div class="panel">
    <div id="modeBadge">جاري تحميل الخريطة...</div>
    <div class="btn-row">
      <button id="btnAuto" class="active" onclick="setMode('auto')">تلقائي</button>
      <button id="btnDay" onclick="setMode('day')">نهاري ☀️</button>
      <button id="btnNight" onclick="setMode('night')">ليلي 🌙</button>
    </div>
  </div>
  <div id="map"></div>

  <script>
    let currentMode = 'auto';

    function computeIsNight() {
      if (currentMode === 'night') return true;
      if (currentMode === 'day') return false;
      const hour = new Date().getHours();
      return hour >= 18 || hour < 6;
    }

    // نقاط إنارة شوارع وتقاطعات في بغداد كبداية قابلة للتوسع لباقي المحافظات
    const streetLightsGeoJSON = {
      type: "FeatureCollection",
      features: [
        { type: "Feature", properties: { name: "ساحة التحرير" }, geometry: { type: "Point", coordinates: [44.4054, 33.3267] } },
        { type: "Feature", properties: { name: "الكرادة" }, geometry: { type: "Point", coordinates: [44.4265, 33.3075] } },
        { type: "Feature", properties: { name: "المنصور" }, geometry: { type: "Point", coordinates: [44.3462, 33.3128] } },
        { type: "Feature", properties: { name: "الجادرية" }, geometry: { type: "Point", coordinates: [44.3820, 33.2850] } },
        { type: "Feature", properties: { name: "الرصافي" }, geometry: { type: "Point", coordinates: [44.4150, 33.3450] } },
        { type: "Feature", properties: { name: "الكرخ" }, geometry: { type: "Point", coordinates: [44.3550, 33.3380] } }
      ]
    };

    // مباني 3D مع ارتفاعات وتأثير إضاءة نوافذ ليلاً
    const buildings3DGeoJSON = {
      type: "FeatureCollection",
      features: [
        {
          type: "Feature",
          properties: { height: 65, base: 0 },
          geometry: {
            type: "Polygon",
            coordinates: [[
              [44.4035, 33.3255], [44.4050, 33.3255], [44.4050, 33.3268], [44.4035, 33.3268], [44.4035, 33.3255]
            ]]
          }
        },
        {
          type: "Feature",
          properties: { height: 85, base: 0 },
          geometry: {
            type: "Polygon",
            coordinates: [[
              [44.3450, 33.3118], [44.3470, 33.3118], [44.3470, 33.3133], [44.3450, 33.3133], [44.3450, 33.3118]
            ]]
          }
        },
        {
          type: "Feature",
          properties: { height: 50, base: 0 },
          geometry: {
            type: "Polygon",
            coordinates: [[
              [44.4250, 33.3065], [44.4270, 33.3065], [44.4270, 33.3080], [44.4250, 33.3080], [44.4250, 33.3065]
            ]]
          }
        }
      ]
    };

    const map = new maplibregl.Map({
      container: "map",
      style: {
        version: 8,
        sources: {
          osm: {
            type: "raster",
            tiles: ["https://tile.openstreetmap.org/{z}/{x}/{y}.png"],
            tileSize: 256,
            attribution: "© OpenStreetMap"
          },
          streetLights: {
            type: "geojson",
            data: streetLightsGeoJSON
          },
          buildings3d: {
            type: "geojson",
            data: buildings3DGeoJSON
          }
        },
        layers: [
          {
            id: "osm-layer",
            type: "raster",
            source: "osm",
            paint: {
              "raster-brightness-max": 0.30,
              "raster-contrast": 0.25,
              "raster-saturation": -0.45
            }
          },
          {
            id: "buildings-3d-layer",
            type: "fill-extrusion",
            source: "buildings3d",
            paint: {
              "fill-extrusion-color": "#fbbf24",
              "fill-extrusion-height": ["get", "height"],
              "fill-extrusion-base": ["get", "base"],
              "fill-extrusion-opacity": 0.92
            }
          },
          {
            id: "street-lights-glow",
            type: "circle",
            source: "streetLights",
            paint: {
              "circle-radius": ["interpolate", ["linear"], ["zoom"], 10, 10, 15, 32],
              "circle-color": "#fbbf24",
              "circle-opacity": 0.45,
              "circle-blur": 0.9
            }
          },
          {
            id: "street-lights-core",
            type: "circle",
            source: "streetLights",
            paint: {
              "circle-radius": ["interpolate", ["linear"], ["zoom"], 10, 3, 15, 7],
              "circle-color": "#fef08a",
              "circle-opacity": 0.95
            }
          }
        ]
      },
      center: [44.3820, 33.3152],
      zoom: 12.5,
      pitch: 60,
      bearing: -15
    });

    map.addControl(new maplibregl.NavigationControl());

    function applyVisualMode() {
      const night = computeIsNight();
      document.getElementById("modeBadge").innerText = night
        ? (currentMode === "auto" ? "الوضع الليلي التلقائي مفعّل 🌙" : "الوضع الليلي مفعّل 🌙")
        : (currentMode === "auto" ? "الوضع النهاري التلقائي مفعّل ☀️" : "الوضع النهاري مفعّل ☀️");

      if (!map.getLayer("osm-layer")) return;

      map.setPaintProperty("osm-layer", "raster-brightness-max", night ? 0.28 : 1.0);
      map.setPaintProperty("osm-layer", "raster-contrast", night ? 0.28 : 0.05);
      map.setPaintProperty("osm-layer", "raster-saturation", night ? -0.45 : 0.1);

      // إنارة المباني ليلاً وواجهة حجرية/رمادية نهاراً
      map.setPaintProperty("buildings-3d-layer", "fill-extrusion-color", night ? "#f59e0b" : "#cbd5e1");
      map.setPaintProperty("buildings-3d-layer", "fill-extrusion-opacity", night ? 0.92 : 0.85);

      // توهج إنارة الشوارع يظهر بقوة ليلاً ويخف نهاراً
      map.setPaintProperty("street-lights-glow", "circle-opacity", night ? 0.5 : 0.08);
      map.setPaintProperty("street-lights-core", "circle-opacity", night ? 0.95 : 0.35);
    }

    function setMode(mode) {
      currentMode = mode;
      document.getElementById("btnAuto").classList.toggle("active", mode === "auto");
      document.getElementById("btnDay").classList.toggle("active", mode === "day");
      document.getElementById("btnNight").classList.toggle("active", mode === "night");
      applyVisualMode();
    }

    map.on("load", applyVisualMode);
  </script>
</body>
</html>
