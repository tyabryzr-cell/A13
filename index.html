<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>GPS وملاحة 3D</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800&display=swap" rel="stylesheet" />
  <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <style>
    * { box-sizing: border-box; user-select: none; }
    html, body, #map {
      margin: 0; padding: 0; width: 100%; height: 100%;
      background: #090d16; font-family: 'Cairo', sans-serif;
      overflow: hidden;
    }

    .panel {
      position: fixed; top: 12px; right: 12px; z-index: 25;
      background: rgba(10, 15, 28, 0.94); color: #f8fafc;
      padding: 10px 12px; border-radius: 14px; font-size: 13px;
      border: 1px solid rgba(251, 191, 36, 0.45);
      backdrop-filter: blur(8px);
      display: flex; flex-direction: column; gap: 8px; max-width: 340px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.45);
    }
    .panel.day-ui {
      background: rgba(255, 255, 255, 0.95);
      color: #0f172a;
      border-color: rgba(15, 23, 42, 0.2);
    }

    .btn-row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
    button, select {
      background: #1e293b; color: #f8fafc;
      border: 1px solid rgba(255,255,255,0.16);
      border-radius: 8px; padding: 6px 10px;
      font-size: 12px; font-weight: 700; cursor: pointer;
      font-family: 'Cairo', sans-serif;
    }
    button.active { background: #f59e0b; color: #090d16; font-weight: 800; border-color: #f59e0b; }

    .day-ui button, .day-ui select {
      background: #e2e8f0; color: #0f172a;
      border-color: rgba(15,23,42,0.12);
    }
    .day-ui button.active {
      background: #d97706; color: #ffffff; border-color: #d97706;
    }

    .nav-bar {
      position: fixed; bottom: 58px; right: 12px; left: 12px; z-index: 25;
      background: rgba(10, 15, 28, 0.94); color: #f8fafc;
      border: 1px solid rgba(56, 189, 248, 0.4);
      border-radius: 14px; padding: 8px 12px;
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
      backdrop-filter: blur(8px);
      box-shadow: 0 8px 24px rgba(0,0,0,0.45);
      font-size: 12px; font-weight: 700;
    }
    .nav-bar.day-ui {
      background: rgba(255, 255, 255, 0.95);
      color: #0f172a;
      border-color: rgba(15, 23, 42, 0.2);
    }

    .gov-bar {
      position: fixed; bottom: 10px; right: 12px; left: 12px; z-index: 25;
      background: rgba(10, 15, 28, 0.94);
      border: 1px solid rgba(251, 191, 36, 0.35);
      border-radius: 14px; padding: 7px 10px;
      display: flex; gap: 6px; overflow-x: auto;
      backdrop-filter: blur(8px);
    }
    .gov-bar.day-ui {
      background: rgba(255, 255, 255, 0.95);
      border-color: rgba(15, 23, 42, 0.2);
    }
    .gov-btn { flex-shrink: 0; }

    .gps-dot {
      width: 22px; height: 22px;
      border-radius: 50%;
      background: #38bdf8;
      border: 3px solid #ffffff;
      box-shadow: 0 0 14px rgba(56, 189, 248, 0.95);
    }
  </style>
</head>
<body>

  <div class="panel" id="controlPanel">
    <div id="modeBadge" style="font-weight:800;">الوضع الليلي التلقائي مفعّل 🌙</div>
    <div class="btn-row">
      <button id="btnAuto" class="active" onclick="setMode('auto')">تلقائي</button>
      <button id="btnDay" onclick="setMode('day')">نهاري ☀️</button>
      <button id="btnNight" onclick="setMode('night')">ليلي 🌙</button>
      <button id="btnSat" class="active" onclick="toggleSatellite()">قمر صناعي 🛰️</button>
    </div>
    <div class="btn-row">
      <button id="btnGPS" onclick="toggleGPS()">موقعي GPS 📍</button>
      <button id="btn3D" class="active" onclick="toggle3D()">مجسمات 3D</button>
      <button onclick="map.zoomIn()">+</button>
      <button onclick="map.zoomOut()">−</button>
      <button onclick="resetNorth()">الشمال</button>
    </div>
  </div>

  <!-- شريط الملاحة والمسار الحقيقي -->
  <div class="nav-bar" id="navBar">
    <div id="navInfo">اختر وجهة أو اضغط على الخريطة لرسم مسار</div>
    <div style="display:flex;gap:6px;align-items:center;">
      <select id="destSelect" onchange="routeToSelected()">
        <option value="">وجهة سريعة...</option>
        <option value="45.2845,31.3265">كورنيش السماوة</option>
        <option value="45.2944,31.3320">مركز السماوة</option>
        <option value="44.4054,33.3267">ساحة التحرير - بغداد</option>
        <option value="44.3820,33.2850">الجادرية - بغداد</option>
        <option value="44.3462,31.9960">مركز النجف</option>
      </select>
      <button onclick="clearRoute()">مسح</button>
    </div>
  </div>

  <div class="gov-bar" id="govBar"></div>
  <div id="map"></div>

  <script>
    maplibregl.setRTLTextPlugin(
      'https://unpkg.com/@mapbox/mapbox-gl-rtl-text@0.2.3/mapbox-gl-rtl-text.min.js',
      true
    );

    const govs = [
      { id: "muthanna", name: "السماوة (المثنى)", lng: 45.2944, lat: 31.3320, zoom: 16.0 },
      { id: "baghdad", name: "بغداد", lng: 44.3820, lat: 33.2850, zoom: 16.0 },
      { id: "najaf", name: "النجف", lng: 44.3462, lat: 31.9960, zoom: 16.0 },
      { id: "basra", name: "البصرة", lng: 47.7804, lat: 30.5085, zoom: 15.8 },
      { id: "karbala", name: "كربلاء", lng: 44.0249, lat: 32.6160, zoom: 15.9 },
      { id: "erbil", name: "أربيل", lng: 44.0092, lat: 36.1911, zoom: 15.8 },
      { id: "mosul", name: "الموصل", lng: 43.1189, lat: 36.3400, zoom: 15.8 },
      { id: "babylon", name: "بابل", lng: 44.4267, lat: 32.4637, zoom: 15.9 },
      { id: "dhiqar", name: "ذي قار", lng: 46.2573, lat: 31.0437, zoom: 15.9 },
      { id: "wasit", name: "واسط", lng: 45.8173, lat: 32.5128, zoom: 15.9 },
      { id: "maysan", name: "ميسان", lng: 47.1450, lat: 31.8356, zoom: 15.9 },
      { id: "diwaniya", name: "الديوانية", lng: 44.9255, lat: 31.9922, zoom: 15.9 },
      { id: "anbar", name: "الأنبار", lng: 43.3078, lat: 33.4262, zoom: 15.8 },
      { id: "diyala", name: "ديالى", lng: 44.6380, lat: 33.7540, zoom: 15.9 },
      { id: "salahaddin", name: "صلاح الدين", lng: 43.6786, lat: 34.6120, zoom: 15.8 },
      { id: "kirkuk", name: "كركوك", lng: 44.3666, lat: 35.4681, zoom: 15.8 },
      { id: "duhok", name: "دهوك", lng: 42.9504, lat: 36.8675, zoom: 15.8 },
      { id: "sulaymaniyah", name: "السليمانية", lng: 45.4329, lat: 35.5570, zoom: 15.8 }
    ];

    let currentMode = 'auto';
    let is3D = true;
    let isSatellite = true;
    let gpsWatchId = null;
    let currentUserLngLat = [45.2944, 31.3320];
    let gpsMarker = null;
    let destMarker = null;

    const govBar = document.getElementById('govBar');
    govs.forEach((g, idx) => {
      const btn = document.createElement('button');
      btn.className = 'gov-btn' + (idx === 0 ? ' active' : '');
      btn.id = 'gbtn-' + g.id;
      btn.innerText = g.name;
      btn.onclick = () => focusGov(g.id);
      govBar.appendChild(btn);
    });

    function isNight() {
      if (currentMode === 'night') return true;
      if (currentMode === 'day') return false;
      const h = new Date().getHours();
      return h >= 18 || h < 6;
    }

    const map = new maplibregl.Map({
      container: "map",
      style: "https://tiles.openfreemap.org/styles/liberty",
      center: currentUserLngLat,
      zoom: 16.0,
      pitch: 58,
      bearing: -12,
      antialias: true
    });

    map.on('load', () => {
      if (!map.getSource('esri-satellite')) {
        map.addSource('esri-satellite', {
          type: 'raster',
          tiles: ['https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'],
          tileSize: 256,
          attribution: '© Esri'
        });
      }

      const layers = map.getStyle().layers;
      let firstSymbolId;
      for (const l of layers) {
        if (l.type === 'symbol' && l.layout && l.layout['text-field']) {
          firstSymbolId = l.id;
          break;
        }
      }

      if (!map.getLayer('satellite-layer')) {
        map.addLayer({
          id: 'satellite-layer',
          type: 'raster',
          source: 'esri-satellite',
          layout: { visibility: isSatellite ? 'visible' : 'none' },
          paint: { 'raster-opacity': 0.95 }
        }, firstSymbolId);
      }

      if (map.getLayer('building')) map.setLayoutProperty('building', 'visibility', 'none');
      if (map.getLayer('building-3d')) map.removeLayer('building-3d');

      if (!map.getLayer('real-osm-3d')) {
        map.addLayer({
          id: 'real-osm-3d',
          source: 'openmaptiles',
          'source-layer': 'building',
          type: 'fill-extrusion',
          minzoom: 14,
          paint: {
            'fill-extrusion-color': '#475569',
            'fill-extrusion-height': [
              'interpolate', ['linear'], ['zoom'],
              14, 0,
              14.8, ['min', 45, ['*', ['coalesce', ['get', 'render_height'], 10], 1.15]]
            ],
            'fill-extrusion-base': ['coalesce', ['get', 'render_min_height'], 0],
            'fill-extrusion-opacity': 0.92
          }
        }, firstSymbolId);
      }

      // مصدر المسار الحقيقي (OSRM)
      map.addSource('osrm-route', {
        type: 'geojson',
        data: { type: 'FeatureCollection', features: [] }
      });

      map.addLayer({
        id: 'osrm-route-line',
        type: 'line',
        source: 'osrm-route',
        layout: { 'line-join': 'round', 'line-cap': 'round' },
        paint: {
          'line-color': '#38bdf8',
          'line-width': 7,
          'line-opacity': 0.92
        }
      }, firstSymbolId);

      updateTheme();
    });

    // رسم مسار حقيقي من موقعك الحالي إلى نقطة مختارة عبر OSRM
    async function drawRealRoute(destLng, destLat) {
      const [startLng, startLat] = currentUserLngLat;
      document.getElementById('navInfo').innerText = 'جاري حساب المسار...';

      try {
        const url = `https://router.project-osrm.org/route/v1/driving/${startLng},${startLat};${destLng},${destLat}?overview=full&geometries=geojson`;
        const res = await fetch(url);
        const data = await res.json();

        if (!data.routes || !data.routes.length) {
          document.getElementById('navInfo').innerText = 'تعذر إيجاد مسار لهذا المكان';
          return;
        }

        const route = data.routes[0];
        map.getSource('osrm-route').setData({
          type: 'Feature',
          geometry: route.geometry
        });

        if (destMarker) destMarker.remove();
        destMarker = new maplibregl.Marker({ color: '#ef4444' })
          .setLngLat([destLng, destLat])
          .addTo(map);

        const km = (route.distance / 1000).toFixed(1);
        const mins = Math.max(1, Math.round(route.duration / 60));
        document.getElementById('navInfo').innerText = `المسافة: ${km} كم • الزمن التقريبي: ${mins} دقيقة`;
      } catch (e) {
        document.getElementById('navInfo').innerText = 'حدث خطأ أثناء جلب المسار';
      }
    }

    function routeToSelected() {
      const val = document.getElementById('destSelect').value;
      if (!val) return;
      const [lng, lat] = val.split(',').map(Number);
      drawRealRoute(lng, lat);
    }

    function clearRoute() {
      document.getElementById('destSelect').value = '';
      if (map.getSource('osrm-route')) {
        map.getSource('osrm-route').setData({ type: 'FeatureCollection', features: [] });
      }
      if (destMarker) {
        destMarker.remove();
        destMarker = null;
      }
      document.getElementById('navInfo').innerText = 'اختر وجهة أو اضغط على الخريطة لرسم مسار';
    }

    // تحديد الوجهة بالضغط المباشر على الخريطة
    map.on('click', (e) => {
      if (e.originalEvent.target.closest('button, select, .panel, .nav-bar, .gov-bar')) return;
      drawRealRoute(e.lngLat.lng, e.lngLat.lat);
    });

    // تتبع الموقع الحقيقي عبر GPS
    function toggleGPS() {
      const btn = document.getElementById('btnGPS');
      if (gpsWatchId !== null) {
        navigator.geolocation.clearWatch(gpsWatchId);
        gpsWatchId = null;
        btn.classList.remove('active');
        return;
      }

      if (!navigator.geolocation) {
        alert('المتصفح لا يدعم GPS');
        return;
      }

      btn.classList.add('active');
      gpsWatchId = navigator.geolocation.watchPosition(
        (pos) => {
          const { latitude, longitude, speed } = pos.coords;
          currentUserLngLat = [longitude, latitude];

          if (!gpsMarker) {
            const dot = document.createElement('div');
            dot.className = 'gps-dot';
            gpsMarker = new maplibregl.Marker({ element: dot })
              .setLngLat(currentUserLngLat)
              .addTo(map);
          } else {
            gpsMarker.setLngLat(currentUserLngLat);
          }

          map.flyTo({ center: currentUserLngLat, zoom: 16.2, duration: 600 });

          if (typeof speed === 'number' && !isNaN(speed) && speed >= 0) {
            const kmh = Math.round(speed * 3.6);
            document.getElementById('navInfo').innerText = `موقعك مفعّل • السرعة: ${kmh} كم/س`;
          }
        },
        () => {
          btn.classList.remove('active');
          gpsWatchId = null;
          alert('تأكد من تفعيل صلاحية الموقع (GPS) في المتصفح');
        },
        { enableHighAccuracy: true, maximumAge: 1000 }
      );
    }

    function updateTheme() {
      const night = isNight();
      document.getElementById('modeBadge').innerText = night
        ? (currentMode === 'auto' ? 'الوضع الليلي التلقائي مفعّل 🌙' : 'الوضع الليلي مفعّل 🌙')
        : (currentMode === 'auto' ? 'الوضع النهاري التلقائي مفعّل ☀️' : 'الوضع النهاري مفعّل ☀️');

      ['controlPanel', 'navBar', 'govBar'].forEach(id => {
        document.getElementById(id).classList.toggle('day-ui', !night);
      });

      map.setLight({
        anchor: 'viewport',
        color: night ? '#e2e8f0' : '#ffffff',
        intensity: night ? 0.5 : 0.78,
        position: [1.5, 180, 48]
      });

      if (map.getLayer('satellite-layer')) {
        map.setLayoutProperty('satellite-layer', 'visibility', isSatellite ? 'visible' : 'none');
        map.setPaintProperty('satellite-layer', 'raster-brightness-max', night ? 0.45 : 1.0);
        map.setPaintProperty('satellite-layer', 'raster-contrast', night ? 0.25 : 0.05);
      }

      (map.getStyle()?.layers || []).forEach(l => {
        if (['satellite-layer', 'real-osm-3d', 'osrm-route-line'].includes(l.id)) return;
        if (l.type === 'background') {
          map.setPaintProperty(l.id, 'background-color', night ? '#0b111e' : '#e5e7eb');
        }
        if (l.type === 'line' && l.id.includes('road')) {
          map.setPaintProperty(l.id, 'line-color', night ? '#1f2937' : '#9ca3af');
        }
      });

      if (map.getLayer('real-osm-3d')) {
        map.setPaintProperty('real-osm-3d', 'fill-extrusion-color', night
          ? [
              'interpolate', ['linear'], ['coalesce', ['get', 'render_height'], 10],
              0, '#1e293b',
              15, '#334155',
              30, '#475569'
            ]
          : [
              'interpolate', ['linear'], ['coalesce', ['get', 'render_height'], 10],
              0, '#e2e8f0',
              15, '#cbd5e1',
              30, '#94a3b8'
            ]
        );
      }
    }

    function toggleSatellite() {
      isSatellite = !isSatellite;
      document.getElementById('btnSat').classList.toggle('active', isSatellite);
      updateTheme();
    }

    function setMode(m) {
      currentMode = m;
      ['btnAuto', 'btnDay', 'btnNight'].forEach(id => document.getElementById(id).classList.remove('active'));
      if (m === 'auto') document.getElementById('btnAuto').classList.add('active');
      if (m === 'day') document.getElementById('btnDay').classList.add('active');
      if (m === 'night') document.getElementById('btnNight').classList.add('active');
      updateTheme();
    }

    function toggle3D() {
      is3D = !is3D;
      document.getElementById('btn3D').classList.toggle('active', is3D);
      map.easeTo({ pitch: is3D ? 58 : 0, duration: 500 });
      if (map.getLayer('real-osm-3d')) {
        map.setLayoutProperty('real-osm-3d', 'visibility', is3D ? 'visible' : 'none');
      }
    }

    function focusGov(id) {
      const g = govs.find(x => x.id === id);
      if (!g) return;
      currentUserLngLat = [g.lng, g.lat];
      document.querySelectorAll('.gov-btn').forEach(b => b.classList.remove('active'));
      const el = document.getElementById('gbtn-' + id);
      if (el) el.classList.add('active');
      map.flyTo({ center: [g.lng, g.lat], zoom: g.zoom, pitch: is3D ? 58 : 0, duration: 800 });
    }

    function resetNorth() {
      map.easeTo({ bearing: 0, duration: 500 });
    }
  </script>
</body>
</html>
