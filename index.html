<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>خريطة العراق GPS 3D</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800&display=swap" rel="stylesheet" />
  <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <style>
    * { box-sizing: border-box; }
    html, body, #map {
      margin: 0; padding: 0; width: 100%; height: 100%;
      background: #090d16; font-family: 'Cairo', sans-serif;
      overflow: hidden;
    }

    .top-panel {
      position: fixed; top: 10px; right: 10px; left: 10px; z-index: 30;
      background: rgba(10, 15, 28, 0.92); color: #f8fafc;
      padding: 8px 10px; border-radius: 14px;
      border: 1px solid rgba(251, 191, 36, 0.4);
      backdrop-filter: blur(8px);
      display: flex; flex-direction: column; gap: 6px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.45);
      max-width: 440px;
    }
    .top-panel.day-ui {
      background: rgba(255, 255, 255, 0.95);
      color: #0f172a;
      border-color: rgba(15, 23, 42, 0.18);
    }

    .row {
      display: flex; align-items: center; gap: 5px; flex-wrap: wrap;
    }

    button {
      background: #1e293b; color: #f8fafc;
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 8px; padding: 5px 8px;
      font-size: 11px; font-weight: 700; cursor: pointer;
      font-family: 'Cairo', sans-serif;
      white-space: nowrap;
    }
    button:active { transform: scale(0.96); }
    button.active {
      background: #f59e0b; color: #090d16;
      font-weight: 800; border-color: #f59e0b;
    }
    button.gps-active {
      background: #0284c7; color: #ffffff;
      border-color: #38bdf8;
    }

    .day-ui button {
      background: #e2e8f0; color: #0f172a;
      border-color: rgba(15, 23, 42, 0.12);
    }
    .day-ui button.active {
      background: #d97706; color: #ffffff; border-color: #d97706;
    }

    .gps-trip-bar {
      position: fixed; bottom: 54px; right: 10px; left: 10px; z-index: 30;
      background: rgba(10, 15, 28, 0.94); color: #f8fafc;
      border: 1px solid rgba(56, 189, 248, 0.45);
      border-radius: 14px; padding: 8px 10px;
      display: flex; flex-direction: column; gap: 6px;
      backdrop-filter: blur(8px);
      box-shadow: 0 8px 22px rgba(0, 0, 0, 0.45);
    }
    .gps-trip-bar.day-ui {
      background: rgba(255, 255, 255, 0.96);
      color: #0f172a;
      border-color: rgba(15, 23, 42, 0.2);
    }

    .search-row { display: flex; gap: 6px; align-items: center; }
    .search-input {
      flex: 1;
      background: rgba(30, 41, 59, 0.9);
      color: #ffffff;
      border: 1px solid rgba(148, 163, 184, 0.3);
      border-radius: 8px;
      padding: 6px 10px;
      font-size: 12px; font-weight: 600;
      font-family: 'Cairo', sans-serif;
      outline: none;
    }
    .day-ui .search-input {
      background: #f1f5f9;
      color: #0f172a;
      border-color: rgba(15, 23, 42, 0.2);
    }

    .trip-status {
      display: flex; align-items: center; justify-content: space-between;
      font-size: 12px; font-weight: 700;
      color: #38bdf8;
    }
    .day-ui .trip-status { color: #0369a1; }

    .gov-bar {
      position: fixed; bottom: 8px; right: 10px; left: 10px; z-index: 30;
      background: rgba(10, 15, 28, 0.94);
      border: 1px solid rgba(251, 191, 36, 0.35);
      border-radius: 12px; padding: 6px 8px;
      display: flex; gap: 5px; overflow-x: auto;
      backdrop-filter: blur(8px);
    }
    .gov-bar.day-ui {
      background: rgba(255, 255, 255, 0.95);
      border-color: rgba(15, 23, 42, 0.2);
    }
    .gov-btn { flex-shrink: 0; }

    .user-puck {
      width: 22px; height: 22px;
      border-radius: 50%;
      background: #0ea5e9;
      border: 3px solid #ffffff;
      box-shadow: 0 0 16px rgba(14, 165, 233, 0.95);
    }

    .tree-3d-marker {
      width: 14px; height: 14px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #4ade80, #15803d 75%);
      box-shadow: 0 3px 6px rgba(0, 0, 0, 0.55);
      border: 1px solid rgba(220, 252, 231, 0.45);
      pointer-events: none;
    }
  </style>
</head>
<body>

  <div class="top-panel" id="topPanel">
    <div class="row" style="justify-content: space-between;">
      <span id="modeBadge" style="font-size:12px;font-weight:800;">الوضع الليلي التلقائي 🌙</span>
      <div class="row">
        <button id="btnAuto" class="active" onclick="setMode('auto')">تلقائي</button>
        <button id="btnDay" onclick="setMode('day')">نهاري ☀️</button>
        <button id="btnNight" onclick="setMode('night')">ليلي 🌙</button>
      </div>
    </div>
    <div class="row">
      <button id="btnGPS" onclick="toggleGPS()">موقعي GPS 📍</button>
      <button id="btnSat" class="active" onclick="toggleSatellite()">قمر صناعي 🛰️</button>
      <button id="btn3D" class="active" onclick="toggle3D()">مجسمات 3D</button>
      <button onclick="map.zoomIn()">+</button>
      <button onclick="map.zoomOut()">−</button>
      <button onclick="resetNorth()">الشمال</button>
    </div>
  </div>

  <div class="gps-trip-bar" id="gpsBar">
    <div class="search-row">
      <input id="placeInput" class="search-input" type="text" placeholder="ابحث عن شارع أو مكان بالعراق أو اضغط على الخريطة..." onkeydown="if(event.key==='Enter') searchDestination()" />
      <button class="active" onclick="searchDestination()">ذهاب</button>
      <button onclick="clearTrip()">مسح</button>
    </div>
    <div class="trip-status">
      <span id="tripDetails">اضغط على الخريطة أو ابحث لرسم مسار رحلة</span>
      <span id="speedBadge">السرعة: 0 كم/س</span>
    </div>
  </div>

  <div class="gov-bar" id="govBar"></div>
  <div id="map"></div>

  <script>
    maplibregl.setRTLTextPlugin(
      'https://unpkg.com/@mapbox/mapbox-gl-rtl-text@0.2.3/mapbox-gl-rtl-text.min.js',
      true
    );

    const govs = [
      { id: "muthanna", name: "السماوة (المثنى)", lng: 45.2944, lat: 31.3320, zoom: 16.2 },
      { id: "baghdad", name: "بغداد", lng: 44.3820, lat: 33.2850, zoom: 16.2 },
      { id: "najaf", name: "النجف", lng: 44.3462, lat: 31.9960, zoom: 16.2 },
      { id: "basra", name: "البصرة", lng: 47.7804, lat: 30.5085, zoom: 16.0 },
      { id: "karbala", name: "كربلاء", lng: 44.0249, lat: 32.6160, zoom: 16.1 },
      { id: "erbil", name: "أربيل", lng: 44.0092, lat: 36.1911, zoom: 16.0 },
      { id: "mosul", name: "الموصل", lng: 43.1189, lat: 36.3400, zoom: 16.0 },
      { id: "babylon", name: "بابل", lng: 44.4267, lat: 32.4637, zoom: 16.1 },
      { id: "dhiqar", name: "ذي قار", lng: 46.2573, lat: 31.0437, zoom: 16.1 },
      { id: "wasit", name: "واسط", lng: 45.8173, lat: 32.5128, zoom: 16.1 },
      { id: "maysan", name: "ميسان", lng: 47.1450, lat: 31.8356, zoom: 16.1 },
      { id: "diwaniya", name: "الديوانية", lng: 44.9255, lat: 31.9922, zoom: 16.1 },
      { id: "anbar", name: "الأنبار", lng: 43.3078, lat: 33.4262, zoom: 16.0 },
      { id: "diyala", name: "ديالى", lng: 44.6380, lat: 33.7540, zoom: 16.1 },
      { id: "salahaddin", name: "صلاح الدين", lng: 43.6786, lat: 34.6120, zoom: 16.0 },
      { id: "kirkuk", name: "كركوك", lng: 44.3666, lat: 35.4681, zoom: 16.0 },
      { id: "duhok", name: "دهوك", lng: 42.9504, lat: 36.8675, zoom: 16.0 },
      { id: "sulaymaniyah", name: "السليمانية", lng: 45.4329, lat: 35.5570, zoom: 16.0 }
    ];

    let currentMode = 'auto';
    let is3D = true;
    let isSatellite = true;
    let watchId = null;
    let startPoint = [45.2944, 31.3320];
    let userMarker = null;
    let destMarker = null;
    const treeMarkers = [];

    const govBar = document.getElementById('govBar');
    govs.forEach((g, i) => {
      const b = document.createElement('button');
      b.className = 'gov-btn' + (i === 0 ? ' active' : '');
      b.id = 'gbtn-' + g.id;
      b.innerText = g.name;
      b.onclick = () => focusGov(g.id);
      govBar.appendChild(b);
    });

    function isNight() {
      if (currentMode === 'night') return true;
      if (currentMode === 'day') return false;
      const h = new Date().getHours();
      return h >= 18 || h < 6;
    }

    const map = new maplibregl.Map({
      container: "map",
      style: "https://tiles.openfreemap.org/styles/liberty",
      center: startPoint,
      zoom: 16.2,
      pitch: 60,
      bearing: -12,
      antialias: true
    });

    // إضافة مجسمات أشجار خفيفة حول المركز الحالي عند الزوم القريب فوق القمر الصناعي
    function refreshNearbyTrees(centerLngLat) {
      treeMarkers.forEach(m => m.remove());
      treeMarkers.length = 0;
      if (!is3D || map.getZoom() < 15.8) return;

      const [cx, cy] = centerLngLat;
      const offsets = [
        [0.00022, 0.00014], [-0.00024, 0.00018], [0.00019, -0.00021],
        [-0.00021, -0.00016], [0.00035, 0.00005], [-0.00032, -0.00007]
      ];
      offsets.forEach(([dx, dy]) => {
        const el = document.createElement('div');
        el.className = 'tree-3d-marker';
        treeMarkers.push(
          new maplibregl.Marker({ element: el, pitchAlignment: 'map' })
            .setLngLat([cx + dx, cy + dy])
            .addTo(map)
        );
      });
    }

    map.on('load', () => {
      map.addSource('esri-sat', {
        type: 'raster',
        tiles: ['https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'],
        tileSize: 256,
        attribution: '© Esri'
      });

      const layers = map.getStyle().layers;
      let firstSymbolId;
      for (const l of layers) {
        if (l.type === 'symbol' && l.layout && l.layout['text-field']) {
          firstSymbolId = l.id;
          break;
        }
      }

      map.addLayer({
        id: 'sat-layer',
        type: 'raster',
        source: 'esri-sat',
        layout: { visibility: 'visible' },
        paint: { 'raster-opacity': 0.96 }
      }, firstSymbolId);

      if (map.getLayer('building')) map.setLayoutProperty('building', 'visibility', 'none');
      if (map.getLayer('building-3d')) map.removeLayer('building-3d');

      // مجسمات المباني 3D شبه شفافة لتبرز فوق صور القمر الصناعي
      map.addLayer({
        id: 'iraq-buildings-3d',
        source: 'openmaptiles',
        'source-layer': 'building',
        type: 'fill-extrusion',
        minzoom: 13.8,
        paint: {
          'fill-extrusion-color': '#cbd5e1',
          'fill-extrusion-height': [
            'interpolate', ['linear'], ['zoom'],
            13.8, 0,
            14.6, ['min', 60, ['*', ['coalesce', ['get', 'render_height'], 12], 1.25]]
          ],
          'fill-extrusion-base': ['coalesce', ['get', 'render_min_height'], 0],
          'fill-extrusion-opacity': 0.76
        }
      }, firstSymbolId);

      map.addSource('trip-route', {
        type: 'geojson',
        data: { type: 'FeatureCollection', features: [] }
      });

      map.addLayer({
        id: 'trip-route-casing',
        type: 'line',
        source: 'trip-route',
        layout: { 'line-join': 'round', 'line-cap': 'round' },
        paint: { 'line-color': '#0369a1', 'line-width': 10, 'line-opacity': 0.85 }
      }, firstSymbolId);

      map.addLayer({
        id: 'trip-route-line',
        type: 'line',
        source: 'trip-route',
        layout: { 'line-join': 'round', 'line-cap': 'round' },
        paint: { 'line-color': '#38bdf8', 'line-width': 5.5, 'line-opacity': 0.98 }
      }, firstSymbolId);

      refreshNearbyTrees(startPoint);
      updateTheme();
    });

    map.on('moveend', () => {
      const c = map.getCenter();
      refreshNearbyTrees([c.lng, c.lat]);
    });

    async function buildTripRoute(destLng, destLat, labelName = "الوجهة المحددة") {
      document.getElementById('tripDetails').innerText = 'جاري حساب مسار الرحلة...';
      try {
        const url = `https://router.project-osrm.org/route/v1/driving/${startPoint[0]},${startPoint[1]};${destLng},${destLat}?overview=full&geometries=geojson`;
        const res = await fetch(url);
        const data = await res.json();

        if (!data.routes || !data.routes.length) {
          document.getElementById('tripDetails').innerText = 'تعذر رسم مسار لهذه النقطة';
          return;
        }

        const route = data.routes[0];
        map.getSource('trip-route').setData({
          type: 'Feature',
          geometry: route.geometry
        });

        if (destMarker) destMarker.remove();
        destMarker = new maplibregl.Marker({ color: '#ef4444' })
          .setLngLat([destLng, destLat])
          .addTo(map);

        const km = (route.distance / 1000).toFixed(1);
        const mins = Math.max(1, Math.round(route.duration / 60));
        document.getElementById('tripDetails').innerText = `${labelName}: ${km} كم • ${mins} دقيقة`;

        map.flyTo({
          center: [destLng, destLat],
          zoom: 15.5,
          pitch: is3D ? 60 : 0,
          duration: 900
        });
      } catch (err) {
        document.getElementById('tripDetails').innerText = 'تعذر الاتصال بخدمة المسارات';
      }
    }

    async function searchDestination() {
      const q = document.getElementById('placeInput').value.trim();
      if (!q) return;
      document.getElementById('tripDetails').innerText = `جاري البحث عن "${q}"...`;

      try {
        const url = `https://nominatim.openstreetmap.org/search?format=json&countrycodes=iq&limit=1&q=${encodeURIComponent(q)}`;
        const res = await fetch(url);
        const list = await res.json();

        if (!list || !list.length) {
          document.getElementById('tripDetails').innerText = 'لم يتم العثور على المكان، جرّب اسماً أوضح';
          return;
        }

        const place = list[0];
        buildTripRoute(parseFloat(place.lon), parseFloat(place.lat), q);
      } catch (e) {
        document.getElementById('tripDetails').innerText = 'خطأ أثناء البحث عن المكان';
      }
    }

    function clearTrip() {
      document.getElementById('placeInput').value = '';
      if (map.getSource('trip-route')) {
        map.getSource('trip-route').setData({ type: 'FeatureCollection', features: [] });
      }
      if (destMarker) {
        destMarker.remove();
        destMarker = null;
      }
      document.getElementById('tripDetails').innerText = 'اضغط على الخريطة أو ابحث لرسم مسار رحلة';
    }

    map.on('click', (e) => {
      if (e.originalEvent.target.closest('button, input, .top-panel, .gps-trip-bar, .gov-bar')) return;
      buildTripRoute(e.lngLat.lng, e.lngLat.lat, 'نقطة مختارة');
    });

    function toggleGPS() {
      const btn = document.getElementById('btnGPS');
      if (watchId !== null) {
        navigator.geolocation.clearWatch(watchId);
        watchId = null;
        btn.classList.remove('gps-active');
        document.getElementById('speedBadge').innerText = 'GPS متوقف';
        return;
      }

      if (!navigator.geolocation) {
        alert('جهازك أو المتصفح لا يدعم GPS');
        return;
      }

      btn.classList.add('gps-active');
      document.getElementById('tripDetails').innerText = 'جاري تحديد موقعك عبر الأقمار الصناعية...';

      watchId = navigator.geolocation.watchPosition(
        (pos) => {
          const { latitude, longitude, speed } = pos.coords;
          startPoint = [longitude, latitude];

          if (!userMarker) {
            const el = document.createElement('div');
            el.className = 'user-puck';
            userMarker = new maplibregl.Marker({ element: el }).setLngLat(startPoint).addTo(map);
          } else {
            userMarker.setLngLat(startPoint);
          }

          map.flyTo({ center: startPoint, zoom: 16.4, pitch: is3D ? 60 : 0, duration: 700 });

          const kmh = (typeof speed === 'number' && !isNaN(speed) && speed >= 0) ? Math.round(speed * 3.6) : 0;
          document.getElementById('speedBadge').innerText = `السرعة: ${kmh} كم/س`;
          document.getElementById('tripDetails').innerText = 'تم تحديد موقعك الحالي ✓';
        },
        () => {
          watchId = null;
          btn.classList.remove('gps-active');
          document.getElementById('tripDetails').innerText = 'يرجى السماح بصلاحية الموقع (GPS) في المتصفح';
        },
        { enableHighAccuracy: true, maximumAge: 1000 }
      );
    }

    function updateTheme() {
      const night = isNight();
      document.getElementById('modeBadge').innerText = night
        ? (currentMode === 'auto' ? 'الوضع الليلي التلقائي 🌙' : 'الوضع الليلي 🌙')
        : (currentMode === 'auto' ? 'الوضع النهاري التلقائي ☀️' : 'الوضع النهاري ☀️');

      ['topPanel', 'gpsBar', 'govBar'].forEach(id => {
        document.getElementById(id).classList.toggle('day-ui', !night);
      });

      map.setLight({
        anchor: 'viewport',
        color: night ? '#fde68a' : '#ffffff',
        intensity: night ? 0.55 : 0.85,
        position: [1.5, 180, 50]
      });

      if (map.getLayer('sat-layer')) {
        map.setLayoutProperty('sat-layer', 'visibility', isSatellite ? 'visible' : 'none');
        map.setPaintProperty('sat-layer', 'raster-brightness-max', night ? 0.55 : 1.0);
        map.setPaintProperty('sat-layer', 'raster-contrast', night ? 0.22 : 0.05);
      }

      if (map.getLayer('iraq-buildings-3d')) {
        map.setPaintProperty('iraq-buildings-3d', 'fill-extrusion-color', night
          ? [
              'interpolate', ['linear'], ['coalesce', ['get', 'render_height'], 12],
              0, '#334155',
              16, '#64748b',
              32, '#f59e0b'
            ]
          : [
              'interpolate', ['linear'], ['coalesce', ['get', 'render_height'], 12],
              0, '#f1f5f9',
              16, '#cbd5e1',
              32, '#94a3b8'
            ]
        );
      }
    }

    function toggleSatellite() {
      isSatellite = !isSatellite;
      document.getElementById('btnSat').classList.toggle('active', isSatellite);
      updateTheme();
    }

    function setMode(m) {
      currentMode = m;
      ['btnAuto', 'btnDay', 'btnNight'].forEach(id => document.getElementById(id).classList.remove('active'));
      if (m === 'auto') document.getElementById('btnAuto').classList.add('active');
      if (m === 'day') document.getElementById('btnDay').classList.add('active');
      if (m === 'night') document.getElementById('btnNight').classList.add('active');
      updateTheme();
    }

    function toggle3D() {
      is3D = !is3D;
      document.getElementById('btn3D').classList.toggle('active', is3D);
      map.easeTo({ pitch: is3D ? 60 : 0, duration: 500 });
      if (map.getLayer('iraq-buildings-3d')) {
        map.setLayoutProperty('iraq-buildings-3d', 'visibility', is3D ? 'visible' : 'none');
      }
      const c = map.getCenter();
      refreshNearbyTrees([c.lng, c.lat]);
    }

    function focusGov(id) {
      const g = govs.find(x => x.id === id);
      if (!g) return;
      if (watchId === null) startPoint = [g.lng, g.lat];
      document.querySelectorAll('.gov-btn').forEach(b => b.classList.remove('active'));
      const el = document.getElementById('gbtn-' + id);
      if (el) el.classList.add('active');
      map.flyTo({ center: [g.lng, g.lat], zoom: g.zoom, pitch: is3D ? 60 : 0, duration: 800 });
    }

    function resetNorth() {
      map.easeTo({ bearing: 0, duration: 500 });
    }
  </script>
</body>
</html>
