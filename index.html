<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>ملاحة 3D تفصيلية</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800&display=swap" rel="stylesheet" />
  <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <style>
    * { box-sizing: border-box; user-select: none; }
    html, body, #map {
      margin: 0; padding: 0; width: 100%; height: 100%;
      background: #0b1320; font-family: 'Cairo', sans-serif;
      overflow: hidden;
    }

    /* الشريط العلوي: بطاقة التوجيه + السرعة */
    .top-hud {
      position: fixed; top: 12px; left: 12px; right: 12px; z-index: 30;
      display: flex; align-items: flex-start; gap: 10px;
      pointer-events: none;
    }

    .turn-card {
      pointer-events: auto;
      background: #1d4ed8;
      border: 1px solid rgba(191, 219, 254, 0.35);
      border-radius: 14px;
      overflow: hidden;
      min-width: 210px;
      max-width: 270px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.45);
      cursor: pointer;
    }

    .turn-top {
      padding: 10px 14px;
      display: flex; align-items: center; gap: 12px;
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
    }

    .turn-arrow-main {
      color: #ffffff;
      font-size: 26px; font-weight: 800; line-height: 1;
    }

    .turn-meta {
      display: flex; flex-direction: column; text-align: right;
    }
    .turn-dist {
      color: #ffffff; font-size: 20px; font-weight: 800; line-height: 1.15;
    }
    .turn-street {
      color: #dbeafe; font-size: 13px; font-weight: 700;
    }

    .lane-strip {
      background: #1e40af;
      border-top: 1px solid rgba(255, 255, 255, 0.16);
      padding: 5px 14px;
      display: flex; justify-content: space-around; align-items: center;
      color: #ffffff; font-size: 16px; font-weight: 800;
    }

    .speed-box {
      pointer-events: auto;
      background: rgba(15, 23, 42, 0.92);
      border: 1px solid rgba(148, 163, 184, 0.35);
      border-radius: 12px;
      padding: 6px 10px;
      display: flex; align-items: center; gap: 10px;
      color: #ffffff;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
    }

    .speed-limit-sign {
      background: #ffffff;
      color: #0f172a;
      border: 3px solid #ef4444;
      border-radius: 8px;
      padding: 2px 7px;
      text-align: center;
      line-height: 1.1;
      font-weight: 800;
    }
    .speed-limit-sign .num { font-size: 16px; display: block; }
    .speed-limit-sign .unit { font-size: 9px; color: #475569; }

    .cur-speed {
      font-size: 20px; font-weight: 800;
    }

    /* لوحة الأوضاع والمدن المصغرة أعلى اليمين */
    .quick-controls {
      position: fixed; top: 12px; right: 12px; z-index: 35;
      display: flex; flex-direction: column; gap: 6px;
      background: rgba(10, 15, 28, 0.88);
      border: 1px solid rgba(148, 163, 184, 0.25);
      border-radius: 12px;
      padding: 7px 8px;
      backdrop-filter: blur(8px);
    }

    .q-row { display: flex; gap: 5px; flex-wrap: wrap; }

    .q-btn {
      background: #1e293b; color: #f8fafc;
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 7px; padding: 4px 8px;
      font-size: 11px; font-weight: 700;
      font-family: 'Cairo', sans-serif;
      cursor: pointer;
    }
    .q-btn.active {
      background: #f59e0b; color: #090d16; border-color: #f59e0b;
    }

    /* أزرار التحكم الجانبية اليسرى */
    .left-rail {
      position: fixed; top: 130px; left: 12px; z-index: 30;
      display: flex; flex-direction: column; gap: 8px;
    }

    .rail-btn {
      width: 40px; height: 40px;
      background: rgba(15, 23, 42, 0.88);
      border: 1px solid rgba(148, 163, 184, 0.28);
      border-radius: 10px;
      color: #f8fafc;
      font-size: 15px; font-weight: 700;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.35);
    }

    /* الشريط السفلي للرحلة */
    .bottom-hud {
      position: fixed; bottom: 14px; left: 12px; right: 12px; z-index: 30;
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
      pointer-events: none;
    }

    .eta-card {
      pointer-events: auto;
      background: rgba(15, 23, 42, 0.94);
      border: 1px solid rgba(148, 163, 184, 0.28);
      border-radius: 14px;
      padding: 8px 14px;
      display: flex; align-items: center; gap: 12px;
      color: #ffffff;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
    }

    .eta-time { font-size: 18px; font-weight: 800; line-height: 1.2; }
    .eta-sub { font-size: 12px; color: #cbd5e1; font-weight: 600; }

    .eta-expand {
      width: 34px; height: 34px;
      border-radius: 9px;
      background: #1e293b;
      border: 1px solid rgba(148, 163, 184, 0.25);
      color: #ffffff;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      font-weight: 800;
    }

    .weather-pill {
      pointer-events: auto;
      background: rgba(15, 23, 42, 0.92);
      border: 1px solid rgba(148, 163, 184, 0.25);
      border-radius: 12px;
      padding: 8px 12px;
      color: #f8fafc;
      font-size: 13px; font-weight: 700;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
    }

    /* مجسمات الأشجار والسيارات على الخريطة */
    .tree-3d {
      width: 18px; height: 18px;
      border-radius: 50% 50% 45% 45%;
      background: radial-gradient(circle at 35% 30%, #4ade80, #166534 75%);
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.55), inset -2px -2px 4px rgba(0,0,0,0.4);
      border: 1px solid rgba(187, 247, 208, 0.25);
      pointer-events: none;
    }

    .car-3d {
      width: 14px; height: 24px;
      background: linear-gradient(180deg, #f8fafc 0%, #cbd5e1 100%);
      border-radius: 5px;
      border: 1px solid #0f172a;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.65);
      position: relative;
      pointer-events: none;
    }
    .car-3d::before {
      content: "";
      position: absolute; top: 5px; left: 2px; right: 2px; height: 5px;
      background: #1e293b; border-radius: 2px;
    }

    .user-car {
      width: 20px; height: 32px;
      background: linear-gradient(180deg, #38bdf8 0%, #0284c7 100%);
      border: 2px solid #ffffff;
      border-radius: 7px;
      box-shadow: 0 0 14px rgba(56, 189, 248, 0.9);
      pointer-events: none;
    }
  </style>
</head>
<body>

  <!-- لوحة الأوضاع والمدن والزاوية -->
  <div class="quick-controls" style="top: auto; bottom: 72px; right: 12px;">
    <div class="q-row">
      <button id="mAuto" class="q-btn active" onclick="setThemeMode('auto')">تلقائي</button>
      <button id="mDay" class="q-btn" onclick="setThemeMode('day')">نهاري</button>
      <button id="mNight" class="q-btn" onclick="setThemeMode('night')">ليلي</button>
    </div>
    <div class="q-row">
      <button class="q-btn" onclick="goCity('baghdad')">بغداد</button>
      <button class="q-btn" onclick="goCity('samawah')">السماوة</button>
      <button id="btn3dToggle" class="q-btn active" onclick="togglePitch()">3D</button>
    </div>
  </div>

  <!-- بطاقة التوجيه والسرعة -->
  <div class="top-hud">
    <div class="turn-card" onclick="toggleSim()">
      <div class="turn-top">
        <div class="turn-arrow-main">↑</div>
        <div class="turn-meta">
          <div class="turn-dist" id="hudDist">1.5 كم</div>
          <div class="turn-street" id="hudStreet">شارع دجلة</div>
        </div>
      </div>
      <div class="lane-strip">
        <span>↑</span>
        <span>↑</span>
        <span style="color:#fde047;">↱</span>
      </div>
    </div>

    <div class="speed-box">
      <div class="speed-limit-sign">
        <span class="num">50</span>
        <span class="unit">km/h</span>
      </div>
      <div class="cur-speed" id="hudSpeed">49</div>
    </div>
  </div>

  <!-- أزرار التحكم الجانبية -->
  <div class="left-rail">
    <button class="rail-btn" onclick="recenterNorth()" title="الشمال">➤</button>
    <button class="rail-btn" onclick="toggleSim()" title="تشغيل/إيقاف الحركة">💬</button>
    <button class="rail-btn" id="soundBtn" onclick="toggleSound()" title="الصوت">🔊</button>
    <button class="rail-btn" onclick="map.zoomIn()" title="تكبير">+</button>
    <button class="rail-btn" onclick="map.zoomOut()" title="تصغير">−</button>
  </div>

  <!-- الشريط السفلي -->
  <div class="bottom-hud">
    <div class="eta-card">
      <div>
        <div class="eta-time" id="etaClock">10:38 م</div>
        <div class="eta-sub" id="etaSummary">6 دقايق • 1.5 كم</div>
      </div>
      <button class="eta-expand" onclick="switchRouteDemo()" title="تبديل المسار">⌃</button>
    </div>

    <div class="weather-pill" id="weatherBox">🌙 19°</div>
  </div>

  <div id="map"></div>

  <script>
    maplibregl.setRTLTextPlugin(
      'https://unpkg.com/@mapbox/mapbox-gl-rtl-text@0.2.3/mapbox-gl-rtl-text.min.js',
      true
    );

    let themeMode = 'auto';
    let pitch3D = true;
    let simulating = true;
    let muted = false;
    let progress = 0;

    const routes = {
      baghdad: {
        street: "شارع دجلة",
        temp: "19°",
        coords: [
          [44.4054, 33.3267],
          [44.4076, 33.3224],
          [44.4095, 33.3188],
          [44.4118, 33.3152],
          [44.4142, 33.3115],
          [44.4165, 33.3080]
        ]
      },
      samawah: {
        street: "كورنيش السماوة",
        temp: "22°",
        coords: [
          [45.2845, 31.3265],
          [45.2872, 31.3281],
          [45.2901, 31.3298],
          [45.2925, 31.3310],
          [45.2944, 31.3320]
        ]
      }
    };

    let currentKey = 'baghdad';
    let activeCoords = routes.baghdad.coords;

    function isNightNow() {
      if (themeMode === 'night') return true;
      if (themeMode === 'day') return false;
      const h = new Date().getHours();
      return h >= 18 || h < 6;
    }

    const map = new maplibregl.Map({
      container: "map",
      style: "https://tiles.openfreemap.org/styles/liberty",
      center: activeCoords[0],
      zoom: 16.8,
      pitch: 65,
      bearing: -15,
      antialias: true
    });

    // سيارة المستخدم الرئيسية
    const userMarker = new maplibregl.Marker({
      element: (() => {
        const d = document.createElement('div');
        d.className = 'user-car';
        return d;
      })(),
      pitchAlignment: 'map',
      rotationAlignment: 'map'
    }).setLngLat(activeCoords[0]).addTo(map);

    // سيارات إضافية وأشجار موزعة حول المسار
    const propMarkers = [];

    function rebuildProps() {
      propMarkers.forEach(m => m.remove());
      propMarkers.length = 0;

      for (let i = 0; i < activeCoords.length - 1; i++) {
        const [lng1, lat1] = activeCoords[i];
        const [lng2, lat2] = activeCoords[i + 1];

        for (let step = 0.25; step < 1; step += 0.35) {
          const lng = lng1 + (lng2 - lng1) * step;
          const lat = lat1 + (lat2 - lat1) * step;

          // شجرة على جانب الطريق
          const treeEl = document.createElement('div');
          treeEl.className = 'tree-3d';
          propMarkers.push(
            new maplibregl.Marker({ element: treeEl, pitchAlignment: 'map' })
              .setLngLat([lng + 0.00018, lat + 0.00008])
              .addTo(map)
          );

          // سيارة مرور في مسار مجاور
          if (Math.random() > 0.35) {
            const carEl = document.createElement('div');
            carEl.className = 'car-3d';
            propMarkers.push(
              new maplibregl.Marker({ element: carEl, pitchAlignment: 'map', rotationAlignment: 'map' })
                .setLngLat([lng - 0.00014, lat - 0.00005])
                .addTo(map)
            );
          }
        }
      }
    }

    function applyTheme() {
      const night = isNightNow();
      document.getElementById('weatherBox').innerText = `${night ? '🌙' : '☀️'} ${routes[currentKey].temp}`;

      map.setLight({
        anchor: 'viewport',
        color: night ? '#cbd5e1' : '#ffffff',
        intensity: night ? 0.55 : 0.78,
        position: [1.5, 180, 50]
      });

      const layers = map.getStyle()?.layers || [];
      layers.forEach(l => {
        if (l.type === 'background') {
          map.setPaintProperty(l.id, 'background-color', night ? '#111827' : '#e2e8f0');
        }
        if (l.type === 'line' && l.id.includes('road')) {
          map.setPaintProperty(l.id, 'line-color', night ? '#334155' : '#ffffff');
        }
      });

      if (map.getLayer('detailed-3d-buildings')) {
        map.setPaintProperty('detailed-3d-buildings', 'fill-extrusion-color', night
          ? [
              'interpolate', ['linear'], ['coalesce', ['get', 'render_height'], 14],
              0, '#1e293b',
              18, '#2b3a4f',
              35, '#3b4f6b',
              60, '#4f688a'
            ]
          : [
              'interpolate', ['linear'], ['coalesce', ['get', 'render_height'], 14],
              0, '#cbd5e1',
              18, '#94a3b8',
              35, '#64748b',
              60, '#475569'
            ]
        );
      }
    }

    map.on('load', () => {
      const layers = map.getStyle().layers;
      let labelLayerId;
      for (const l of layers) {
        if (l.type === 'symbol' && l.layout && l.layout['text-field']) {
          labelLayerId = l.id;
          break;
        }
      }

      if (map.getLayer('building')) map.setLayoutProperty('building', 'visibility', 'none');
      if (map.getLayer('building-3d')) map.removeLayer('building-3d');

      map.addLayer({
        id: 'detailed-3d-buildings',
        source: 'openmaptiles',
        'source-layer': 'building',
        type: 'fill-extrusion',
        minzoom: 14,
        paint: {
          'fill-extrusion-color': '#2b3a4f',
          'fill-extrusion-height': [
            'interpolate', ['linear'], ['zoom'],
            14, 0,
            14.8, ['*', ['coalesce', ['get', 'render_height'], 14], 1.35]
          ],
          'fill-extrusion-base': ['coalesce', ['get', 'render_min_height'], 0],
          'fill-extrusion-opacity': 0.95
        }
      }, labelLayerId);

      // مسار الملاحة مع مسار مميز بلون أزرق واضح
      map.addSource('active-path', {
        type: 'geojson',
        data: {
          type: 'Feature',
          geometry: { type: 'LineString', coordinates: activeCoords }
        }
      });

      map.addLayer({
        id: 'path-casing',
        type: 'line',
        source: 'active-path',
        layout: { 'line-join': 'round', 'line-cap': 'round' },
        paint: { 'line-color': '#1d4ed8', 'line-width': 15, 'line-opacity': 0.85 }
      }, labelLayerId);

      map.addLayer({
        id: 'path-lane',
        type: 'line',
        source: 'active-path',
        layout: { 'line-join': 'round', 'line-cap': 'round' },
        paint: { 'line-color': '#60a5fa', 'line-width': 8, 'line-opacity': 0.95 }
      }, labelLayerId);

      rebuildProps();
      applyTheme();
      startLoop();
    });

    function calcBearing(a, b) {
      const dLng = (b[0] - a[0]) * Math.PI / 180;
      const lat1 = a[1] * Math.PI / 180;
      const lat2 = b[1] * Math.PI / 180;
      const y = Math.sin(dLng) * Math.cos(lat2);
      const x = Math.cos(lat1) * Math.sin(lat2) - Math.sin(lat1) * Math.cos(lat2) * Math.cos(dLng);
      return ((Math.atan2(y, x) * 180 / Math.PI) + 360) % 360;
    }

    function startLoop() {
      setInterval(() => {
        if (!simulating) return;
        progress += 0.007;
        if (progress >= activeCoords.length - 1) progress = 0;

        const i = Math.floor(progress);
        const t = progress - i;
        const p1 = activeCoords[i];
        const p2 = activeCoords[i + 1];

        const lng = p1[0] + (p2[0] - p1[0]) * t;
        const lat = p1[1] + (p2[1] - p1[1]) * t;
        const brg = calcBearing(p1, p2);

        userMarker.setLngLat([lng, lat]);
        userMarker.setRotation(brg);

        map.easeTo({
          center: [lng, lat],
          bearing: brg,
          pitch: pitch3D ? 65 : 0,
          duration: 300,
          easing: x => x
        });

        const leftRatio = Math.max(0.05, 1 - (progress / (activeCoords.length - 1)));
        const remKm = (1.5 * leftRatio).toFixed(1);
        const remMin = Math.max(1, Math.ceil(6 * leftRatio));

        document.getElementById('hudDist').innerText = `${remKm} كم`;
        document.getElementById('etaSummary').innerText = `${remMin} دقايق • ${remKm} كم`;
        document.getElementById('hudSpeed').innerText = Math.floor(47 + Math.sin(progress * 6) * 3);
      }, 300);
    }

    function setThemeMode(mode) {
      themeMode = mode;
      ['mAuto', 'mDay', 'mNight'].forEach(id => document.getElementById(id).classList.remove('active'));
      if (mode === 'auto') document.getElementById('mAuto').classList.add('active');
      if (mode === 'day') document.getElementById('mDay').classList.add('active');
      if (mode === 'night') document.getElementById('mNight').classList.add('active');
      applyTheme();
    }

    function togglePitch() {
      pitch3D = !pitch3D;
      document.getElementById('btn3dToggle').classList.toggle('active', pitch3D);
      map.easeTo({ pitch: pitch3D ? 65 : 0, duration: 500 });
    }

    function goCity(key) {
      currentKey = key;
      activeCoords = routes[key].coords;
      progress = 0;
      document.getElementById('hudStreet').innerText = routes[key].street;
      map.getSource('active-path').setData({
        type: 'Feature',
        geometry: { type: 'LineString', coordinates: activeCoords }
      });
      rebuildProps();
      applyTheme();
    }

    function switchRouteDemo() {
      goCity(currentKey === 'baghdad' ? 'samawah' : 'baghdad');
    }

    function toggleSim() { simulating = !simulating; }
    function recenterNorth() { simulating = false; map.easeTo({ bearing: 0, duration: 500 }); }
    function toggleSound() {
      muted = !muted;
      document.getElementById('soundBtn').innerText = muted ? '🔇' : '🔊';
    }
  </script>
</body>
</html>
